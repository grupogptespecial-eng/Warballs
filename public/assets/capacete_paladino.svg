<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-label="Capacete épico de paladino aberto, sem placa traseira, com penacho e ornamentos dourados">
  <title>Capacete de Paladino — épico e aberto</title>

  <defs>
    <!-- Aço escovado -->
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#f4f6f8"/>
      <stop offset="35%" stop-color="#d7dadf"/>
      <stop offset="70%" stop-color="#bfc3c8"/>
      <stop offset="100%" stop-color="#a6abb1"/>
    </linearGradient>

    <!-- Dourado -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffefad"/>
      <stop offset="45%" stop-color="#e3c972"/>
      <stop offset="100%" stop-color="#b68a34"/>
    </linearGradient>

    <!-- Gem (azul) -->
    <radialGradient id="gem" cx="50%" cy="40%" r="70%">
      <stop offset="0%"  stop-color="#b9e8ff"/>
      <stop offset="55%" stop-color="#5fb4e2"/>
      <stop offset="100%" stop-color="#1f6fae"/>
    </radialGradient>

    <!-- Penacho tons -->
    <linearGradient id="plumeRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e06a6a"/>
      <stop offset="100%" stop-color="#8e1e1e"/>
    </linearGradient>
    <linearGradient id="plumeCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8f1ff"/>
      <stop offset="100%" stop-color="#4caac0"/>
    </linearGradient>
  </defs>

  <style>
    .edge { stroke:url(#gold); stroke-width:10; stroke-linejoin:round; stroke-linecap:round; }
    .engrave { fill:none; stroke:url(#gold); stroke-width:6; opacity:.75; stroke-linecap:round; }
    .rivet { fill:url(#gold); stroke:#8b6a2f; stroke-width:3; }
  </style>

  <!-- PENACHO -->
  <g class="edge">
    <path d="M445 240 q5 -18 10 0 q25 12 35 22 q-25 10 -45 10 q-20 0 -45 -10 q10 -10 35 -22z" fill="url(#steel)"/>
    <path d="M432 220 c-52 -18 -96 8 -122 32 c-20 20 -26 40 -16 60 c10 20 36 32 67 24 c-10 18 -8 36 12 50 c40 28 98 10 118 -18 c12 -16 12 -34 4 -54 c-14 -38 -34 -72 -63 -94z" fill="url(#plumeRed)"/>
    <path d="M468 220 c52 -18 96 8 122 32 c20 20 26 40 16 60 c-10 20 -36 32 -67 24 c10 18 8 36 -12 50 c-40 28 -98 10 -118 -18 c-12 -16 -12 -34 -4 -54 c14 -38 34 -72 63 -94z" fill="url(#plumeCyan)"/>
  </g>

  <!-- CASCO -->
  <g class="edge">
    <path d="M210 560 C252 380 357 262 450 248 C543 262 648 380 690 560 L210 560 Z" fill="url(#steel)"/>
    <path d="M250 505 Q450 442 650 505 L650 565 Q450 525 250 565 Z" fill="url(#steel)"/>
    <path d="M242 503 Q450 438 658 503" fill="none" stroke="url(#gold)" stroke-width="12"/>
    <!-- abertura superior apenas -->
    <path d="M245 560 Q450 518 655 560" fill="none" stroke="url(#gold)" stroke-width="12"/>

    <!-- brasão -->
    <path d="M422 450 h56 l14 26 -42 58 -42 -58z" fill="url(#gold)"/>
    <circle cx="450" cy="486" r="16" fill="url(#gem)"/>

    <!-- rebites -->
    <circle class="rivet" cx="300" cy="528" r="7"/>
    <circle class="rivet" cx="360" cy="514" r="7"/>
    <circle class="rivet" cx="420" cy="506" r="7"/>
    <circle class="rivet" cx="480" cy="506" r="7"/>
    <circle class="rivet" cx="540" cy="514" r="7"/>
    <circle class="rivet" cx="600" cy="528" r="7"/>
  </g>

  <!-- ORNAMENTOS -->
  <g id="wing" class="engrave">
    <path d="M302 545 c30 -26 56 -38 86 -44 c-22 18 -38 32 -44 48 c28 -14 56 -20 86 -20 c-26 12 -45 26 -56 44"/>
    <path d="M318 560 c22 -10 44 -14 66 -14 c-18 10 -32 22 -42 36"/>
  </g>
  <use href="#wing" transform="translate(900,0) scale(-1,1)"/>
  <path class="engrave" d="M350 420 c40 -18 80 -26 100 -26 c20 0 60 8 100 26"/>

  <!-- REALCE DA CÚPULA -->
  <g opacity=".28" fill="#ffffff">
    <path d="M285 392 q122 -110 268 -122 q-26 60 -72 86 q-128 22 -196 36z"/>
  </g>
</svg>
