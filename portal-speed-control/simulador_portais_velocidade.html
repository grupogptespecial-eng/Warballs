<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<title>Simulador de Portais — Velocidade</title>
<style>
:root{color-scheme:dark;--safe-t:env(safe-area-inset-top,0px);--safe-r:env(safe-area-inset-right,0px);--safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);--line:rgba(255,255,255,.16);--panel:rgba(7,12,21,.96);--text:#eef5ff;--muted:#a8b6ca}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#05070c;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}body{overscroll-behavior:none}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#05070c}.bar{position:fixed;z-index:20;top:calc(8px + var(--safe-t));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;max-width:calc(100vw - 16px - var(--safe-l) - var(--safe-r));padding:6px;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:0 10px 30px rgba(0,0,0,.42)}button,select,.file{min-height:42px;border:1px solid var(--line);border-radius:10px;background:rgba(15,23,37,.98);color:var(--text);padding:8px 11px;font:750 12px inherit;cursor:pointer;touch-action:manipulation}.bar label{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px;font-weight:750}.bar select{min-height:36px;padding:5px 24px 5px 8px}.cycle{border-color:rgba(117,207,255,.75);background:rgba(25,64,91,.98)}.status{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:11px;font-weight:700}.setup{position:fixed;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%);width:min(430px,calc(100vw - 28px));padding:22px;border:1px solid var(--line);border-radius:18px;background:rgba(8,14,24,.98);box-shadow:0 20px 60px rgba(0,0,0,.58);text-align:center}.setup[hidden]{display:none}.setup h1{margin:0 0 10px;font-size:20px}.setup p{color:var(--muted);line-height:1.45;font-size:13px}.file{display:inline-flex;align-items:center;justify-content:center;border-color:rgba(117,207,255,.75);background:rgba(25,64,91,.98)}.file input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}@media(max-width:760px),(pointer:coarse){.bar{top:auto;bottom:calc(72px + var(--safe-b));width:calc(100vw - 12px - var(--safe-l) - var(--safe-r));display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;padding:5px}.bar label{grid-column:span 2;justify-content:center;min-height:48px;border:1px solid var(--line);border-radius:10px;background:rgba(15,23,37,.98)}.bar button,.bar select{min-height:48px;font-size:12px;padding:6px}.change{display:none}.status{grid-column:1/-1;max-width:none;text-align:center}}@media(max-height:500px) and (orientation:landscape){.bar{left:auto;right:calc(6px + var(--safe-r));bottom:calc(6px + var(--safe-b));transform:none;width:78px;grid-template-columns:1fr}.bar label{grid-column:1;display:block;font-size:9px;text-align:center}.bar select{width:100%;min-height:38px}.status{display:none}}
</style>
</head>
<body>
<iframe id="sim" title="Simulador de física topológica"></iframe>
<section id="setup" class="setup"><h1>Carregar simulador</h1><p>Selecione a versão final do núcleo HTML. Ela fica guardada neste navegador quando o armazenamento local estiver disponível.</p><label class="file">Escolher núcleo HTML<input id="file" type="file" accept=".html,text/html"></label><p id="setupStatus">Aguardando o arquivo.</p></section>
<nav class="bar"><button id="pause">Pausar</button><label>Velocidade<select id="speed"><option value="0.25">0,25×</option><option value="0.5">0,5×</option><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select></label><button id="cycle" class="cycle">1×</button><button id="change" class="change">Trocar núcleo</button><span id="status" class="status">Sem núcleo</span></nav>
<script>
(()=>{"use strict";const DT=1/240,SPEEDS=[.25,.5,1,2,4],CORE="portal-simulator-core-html-v1",SPEED="portal-simulator-speed-v1",frame=document.getElementById("sim"),setup=document.getElementById("setup"),file=document.getElementById("file"),setupStatus=document.getElementById("setupStatus"),pause=document.getElementById("pause"),speedSelect=document.getElementById("speed"),cycle=document.getElementById("cycle"),change=document.getElementById("change"),status=document.getElementById("status");let api=null,running=true,acc=0,last=performance.now(),lastSync=0;const get=k=>{try{return localStorage.getItem(k)}catch(_){return null}},set=(k,v)=>{try{localStorage.setItem(k,v);return true}catch(_){return false}},del=k=>{try{localStorage.removeItem(k)}catch(_){}};let speed=(()=>{const n=Number(get(SPEED));return SPEEDS.includes(n)?n:1})();const fmt=v=>String(v).replace(".",",")+"×";function sync(){pause.textContent=running?"Pausar":"Continuar";speedSelect.value=String(speed);cycle.textContent=fmt(speed);const d=frame.contentDocument;for(const id of["pauseBtn","mobilePauseBtn"]){const b=d?.getElementById(id);if(b)b.textContent=running?"Pausar":"Continuar"}const s=d?.getElementById("externalSpeedSelect");if(s)s.value=String(speed);const r=d?.getElementById("externalSpeedReadout");if(r)r.textContent=fmt(speed)}function setSpeed(v){const n=Number(v);if(!SPEEDS.includes(n))return;speed=n;set(SPEED,String(n));acc=Math.min(acc,DT*2);sync();status.textContent="Velocidade "+fmt(speed)}function toggle(){running=!running;acc=0;last=performance.now();sync();status.textContent=running?"Executando em "+fmt(speed):"Simulação pausada"}function intercept(b){if(!b||b.dataset.externalController)return;b.dataset.externalController="1";b.onclick=null;b.addEventListener("click",e=>{e.preventDefault();e.stopImmediatePropagation();toggle()},true)}function install(){const d=frame.contentDocument;if(!d)return;intercept(d.getElementById("pauseBtn"));intercept(d.getElementById("mobilePauseBtn"));const controls=d.querySelector("#controlsPanel .controls");if(controls&&!d.getElementById("externalSpeedSelect")){const l=d.createElement("label");l.className="control";l.append("Velocidade ");const s=d.createElement("select");s.id="externalSpeedSelect";for(const v of SPEEDS){const o=d.createElement("option");o.value=String(v);o.textContent=fmt(v);s.appendChild(o)}s.onchange=e=>setSpeed(e.target.value);l.appendChild(s);controls.insertBefore(l,controls.querySelector("#gravityBtn")||null)}const grid=d.querySelector("#physicsPanel .grid");if(grid&&!d.getElementById("externalSpeedReadout")){const row=d.createElement("span");row.className="wide";row.append("ritmo ");const strong=d.createElement("strong");strong.id="externalSpeedReadout";row.appendChild(strong);grid.appendChild(row)}sync()}async function waitApi(){const start=performance.now();while(performance.now()-start<8000){const a=frame.contentWindow?.__portalDebug;if(a?.step&&a?.setPaused)return a;await new Promise(r=>setTimeout(r,40))}return null}frame.addEventListener("load",async()=>{api=await waitApi();if(!api){status.textContent="Núcleo incompatível";setup.hidden=false;setupStatus.textContent="A API window.__portalDebug não foi encontrada.";return}api.setPaused(true);install();setup.hidden=true;acc=0;last=performance.now();status.textContent="Executando em "+fmt(speed)});function load(html,persist=true){if(!html||!/<html[\\s>]/i.test(html)||!/__portalDebug/.test(html)){setupStatus.textContent="Arquivo inválido ou incompatível.";return}api=null;setupStatus.textContent="Carregando…";if(persist&&!set(CORE,html))setupStatus.textContent="Carregando sem armazenamento permanente…";frame.srcdoc=html}file.onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{load(await f.text(),true)}catch(err){setupStatus.textContent="Falha: "+err.message}};pause.onclick=toggle;speedSelect.onchange=e=>setSpeed(e.target.value);cycle.onclick=()=>setSpeed(SPEEDS[(SPEEDS.indexOf(speed)+1)%SPEEDS.length]);change.onclick=()=>{running=false;api=null;frame.removeAttribute("srcdoc");del(CORE);file.value="";setup.hidden=false;setupStatus.textContent="Escolha o núcleo HTML novamente.";status.textContent="Sem núcleo";sync()};addEventListener("keydown",e=>{if(e.target?.matches?.("input,select,textarea"))return;if(e.key===" "){e.preventDefault();toggle()}else if(e.key==="[")setSpeed(SPEEDS[Math.max(0,SPEEDS.indexOf(speed)-1)]);else if(e.key==="]")setSpeed(SPEEDS[Math.min(SPEEDS.length-1,SPEEDS.indexOf(speed)+1)]);else if(e.key==="\\")setSpeed(1)});document.addEventListener("visibilitychange",()=>{last=performance.now();acc=0});function loop(now){const raw=Math.min(Math.max((now-last)/1000,0),.05);last=now;if(api&&running){if(now-lastSync>1000){api.setPaused(true);lastSync=now;install()}acc+=raw*speed;let n=Math.floor(acc/DT),max=matchMedia("(pointer:coarse)").matches?36:48,protectedMode=n>max;if(protectedMode){n=max;acc=Math.min(acc,DT*max*2)}if(n>0){const t=performance.now();try{api.step(n);acc-=n*DT;status.textContent=protectedMode||performance.now()-t>24?fmt(speed)+" · proteção de desempenho ativa":"Executando em "+fmt(speed)}catch(err){running=false;status.textContent="Erro do motor: "+err.message;sync()}}}requestAnimationFrame(loop)}sync();requestAnimationFrame(loop);const stored=get(CORE);if(stored){setupStatus.textContent="Núcleo salvo encontrado. Carregando…";load(stored,false)}})();
</script>
</body>
</html>
