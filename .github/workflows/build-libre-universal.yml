name: Build Libre Remote Universal RC

on:
  push:
    branches:
      - feature/libre-remote-universal-core
    paths:
      - "lg-wifi-remote-app/**"
      - ".github/workflows/build-libre-universal.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply universal source overlay
        shell: bash
        run: |
          set -euo pipefail
          cat .universal-overlay/part-* > /tmp/universal-overlay.b64
          python3 - <<'PYFIX'
          from pathlib import Path
          path = Path('/tmp/universal-overlay.b64')
          data = bytearray(path.read_bytes())
          fixes = {21413: (ord('p'), ord('P')), 24940: (ord('t'), ord('T'))}
          for offset, (actual, expected) in fixes.items():
              if data[offset] != actual:
                  raise SystemExit(f'unexpected overlay byte at {offset}: {data[offset]}')
              data[offset] = expected
          path.write_bytes(data)
          PYFIX
          echo "5a1136e596f241f253ce47403fb94ecf94b430ecba5d3781ecf2fb4908ab1c19  /tmp/universal-overlay.b64" | sha256sum -c -
          base64 --decode /tmp/universal-overlay.b64 > /tmp/universal-overlay.tar.gz
          echo "b31a421c36ee79cf2301721c1b91d99a83282fdcc4fc1bc84a8827dde2c5038a  /tmp/universal-overlay.tar.gz" | sha256sum -c -
          tar -xzf /tmp/universal-overlay.tar.gz -C "$GITHUB_WORKSPACE"
          python3 - <<'PYSOURCE'
          from pathlib import Path
          path = Path('lg-wifi-remote-app/app/src/main/java/com/geronimo/controlelgwifi/TvBackend.kt')
          text = path.read_text()
          old = "class TvBackendRegistry(\n    context: Context,\n    listener: TvBackendListener\n)"
          new = "class TvBackendRegistry(\n    context: Context,\n    private val listener: TvBackendListener\n)"
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('TvBackendRegistry listener signature was not recognized')
          PYSOURCE
          git config user.name "Libre Remote CI"
          git config user.email "actions@users.noreply.github.com"
          git add lg-wifi-remote-app
          if ! git diff --cached --quiet; then
            git commit -m "Apply universal TV backends and performance updates [skip ci]"
            git push origin HEAD:feature/libre-remote-universal-core
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Configure signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.LIBRE_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.LIBRE_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LIBRE_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LIBRE_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/private-key"
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/libre-remote-upload-key.jks"
            SOURCE="GitHub Actions secrets"
          else
            STORE_PASSWORD="$(openssl rand -hex 18)"
            KEY_PASSWORD="$STORE_PASSWORD"
            KEY_ALIAS="libre-remote-universal-test"
            echo "::add-mask::$STORE_PASSWORD"
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/libre-remote-upload-key.jks" \
              -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -dname "CN=Libre Remote Universal Test, OU=Open Source, O=Libre Remote Community, L=Rio de Janeiro, ST=RJ, C=BR"
            SOURCE="temporary test key generated by CI"
            printf 'TEST KEY - NOT THE FINAL PLAY KEY\n\nFile: libre-remote-upload-key.jks\nAlias: %s\nStore password: %s\nKey password: %s\nSource: %s\n' \
              "$KEY_ALIAS" "$STORE_PASSWORD" "$KEY_PASSWORD" "$SOURCE" > "$GITHUB_WORKSPACE/private-key/LEIA-ME.txt"
            cp "$GITHUB_WORKSPACE/libre-remote-upload-key.jks" "$GITHUB_WORKSPACE/private-key/"
          fi
          echo "LIBRE_KEYSTORE_PATH=$GITHUB_WORKSPACE/libre-remote-upload-key.jks" >> "$GITHUB_ENV"
          echo "LIBRE_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "LIBRE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "LIBRE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Unit tests, lint and release build
        working-directory: lg-wifi-remote-app
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:lintRelease \
            :app:assembleRelease \
            :app:bundleRelease 2>&1 | tee build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-Universal-build-diagnostics
          path: |
            lg-wifi-remote-app/build.log
            lg-wifi-remote-app/app/build/reports/lint-results-release.html
            lg-wifi-remote-app/app/build/reports/tests/testDebugUnitTest/
            lg-wifi-remote-app/app/build/outputs/mapping/release/missing_rules.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/source output/store
          APK="lg-wifi-remote-app/app/build/outputs/apk/release/app-release.apk"
          AAB="lg-wifi-remote-app/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          cp "$APK" output/Libre-Remote-Universal-1.1.0-rc1.apk
          cp "$AAB" output/Libre-Remote-Universal-1.1.0-rc1.aab
          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs output/Libre-Remote-Universal-1.1.0-rc1.apk > output/APK-SIGNATURE.txt
          sha256sum output/Libre-Remote-Universal-1.1.0-rc1.apk output/Libre-Remote-Universal-1.1.0-rc1.aab > output/SHA256SUMS.txt
          rsync -a --exclude build --exclude .gradle --exclude .kotlin --exclude local.properties lg-wifi-remote-app/ output/source/
          (cd output && zip -qr Libre-Remote-Universal-1.1.0-rc1-source.zip source && rm -rf source)
          if [ -f private-key/libre-remote-upload-key.jks ]; then
            (cd private-key && zip -qr ../output/PRIVATE-Universal-test-upload-key.zip .)
          fi
          if [ -d lg-wifi-remote-app/store-listing ]; then
            cp -r lg-wifi-remote-app/store-listing/* output/store/
            (cd output && zip -qr Libre-Remote-Universal-store-listing.zip store && rm -rf store)
          fi
          cp lg-wifi-remote-app/build.log output/BUILD-LOG.txt
          ls -lh output

      - name: Upload universal release candidate
        uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-Universal-1.1.0-RC1
          path: output/*
          if-no-files-found: error
          retention-days: 30
