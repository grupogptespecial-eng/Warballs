name: Build Libre Remote Universal Alpha

on:
  push:
    branches:
      - feature/libre-remote-universal-core
    paths:
      - ".universal-patch/**"
      - ".universal-payload/**"
      - "lg-wifi-remote-app/**"
      - ".github/workflows/build-universal.yml"
  pull_request:
    paths:
      - ".universal-patch/**"
      - ".universal-payload/**"
      - "lg-wifi-remote-app/**"
      - ".github/workflows/build-universal.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout universal branch
        uses: actions/checkout@v4
        with:
          ref: feature/libre-remote-universal-core
          fetch-depth: 0

      - name: Apply staged universal source patch
        id: apply_patch
        shell: bash
        run: |
          set -u
          if ! compgen -G ".universal-patch/part-*" > /dev/null; then
            echo "No staged patch found; source is already materialized."
            exit 0
          fi

          cat .universal-patch/part-* > universal.patch
          wc -c universal.patch | tee patch-size.txt
          sha256sum universal.patch | tee patch-sha256.txt
          echo "d1cdd9e342453ed7fe6044ec525c8ec056d50389db8244e1ecaa2ae1ced7ccfd  universal.patch" | sha256sum -c - 2>&1 | tee patch-integrity.txt
          integrity_status=${PIPESTATUS[1]}
          if [ "$integrity_status" -ne 0 ]; then
            echo "Staged patch bytes do not match the validated source patch." | tee patch-apply.log
            exit "$integrity_status"
          fi

          rm -f \
            lg-wifi-remote-app/app/src/main/java/com/geronimo/controlelgwifi/TvBackend.kt \
            lg-wifi-remote-app/app/src/main/java/com/geronimo/controlelgwifi/SamsungTizenBackend.kt \
            lg-wifi-remote-app/app/src/main/java/com/geronimo/controlelgwifi/DlnaBackend.kt \
            lg-wifi-remote-app/UNIVERSAL_COMPATIBILITY.md

          set +e
          (cd lg-wifi-remote-app && patch -p2 --forward --batch < ../universal.patch) 2>&1 | tee patch-apply.log
          patch_status=${PIPESTATUS[0]}
          set -e
          if [ "$patch_status" -ne 0 ]; then
            exit "$patch_status"
          fi

          rm -rf .universal-patch .universal-payload universal.patch
          git config user.name "Libre Remote CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Implement universal TV backends [skip ci]"
            git push origin HEAD:feature/libre-remote-universal-core
          fi

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-Universal-patch-diagnostics
          path: |
            patch-size.txt
            patch-sha256.txt
            patch-integrity.txt
            patch-apply.log
          if-no-files-found: warn
          retention-days: 7

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Generate temporary alpha signing key
        shell: bash
        run: |
          set -euo pipefail
          PASSWORD="$(openssl rand -hex 18)"
          ALIAS="libre-remote-universal-alpha"
          echo "::add-mask::$PASSWORD"
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/universal-alpha.jks" \
            -storepass "$PASSWORD" -keypass "$PASSWORD" -alias "$ALIAS" \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=Libre Remote Universal Alpha, OU=Open Source, O=Libre Remote Community, L=Rio de Janeiro, ST=RJ, C=BR"
          echo "LIBRE_KEYSTORE_PATH=$GITHUB_WORKSPACE/universal-alpha.jks" >> "$GITHUB_ENV"
          echo "LIBRE_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "LIBRE_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "LIBRE_KEY_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

      - name: Unit tests, lint and release build
        working-directory: lg-wifi-remote-app
        run: |
          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:lintRelease \
            :app:assembleRelease \
            :app:bundleRelease

      - name: Verify and package universal alpha
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/source
          APK="lg-wifi-remote-app/app/build/outputs/apk/release/app-release.apk"
          AAB="lg-wifi-remote-app/app/build/outputs/bundle/release/app-release.aab"
          test -f "$APK"
          test -f "$AAB"
          cp "$APK" output/Libre-Remote-Universal-1.1.0-alpha1.apk
          cp "$AAB" output/Libre-Remote-Universal-1.1.0-alpha1.aab
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            output/Libre-Remote-Universal-1.1.0-alpha1.apk > output/APK-SIGNATURE.txt
          sha256sum \
            output/Libre-Remote-Universal-1.1.0-alpha1.apk \
            output/Libre-Remote-Universal-1.1.0-alpha1.aab > output/SHA256SUMS.txt
          rsync -a --exclude build --exclude .gradle --exclude local.properties \
            lg-wifi-remote-app/ output/source/
          (cd output && zip -qr Libre-Remote-Universal-1.1.0-alpha1-source.zip source && rm -rf source)

      - name: Upload universal alpha
        uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-Universal-1.1.0-alpha1
          path: output/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-Universal-reports
          path: |
            lg-wifi-remote-app/app/build/reports/lint-results-release.html
            lg-wifi-remote-app/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
