name: Build Libre Remote 2 Final v3

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "lg-wifi-remote-app/**"
      - ".final-overlay/**"
      - ".final-suffix-hex/**"
      - ".final-suffix-hex-v2/**"
      - ".final-suffix-outer-small/**"
      - ".github/workflows/build-libre-remote-2-final-v3.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: libre-remote-2-final-v3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize-build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Reconstruct exact final source archive
        id: reconstruct
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-v3-diagnostics
          if [ ! -d .final-overlay ]; then
            echo "materialized=false" >> "$GITHUB_OUTPUT"
            test -f lg-wifi-remote-app/settings.gradle.kts
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, tarfile

          prefix_paths = [Path(f'.final-overlay/part-{i:02d}') for i in range(10)]
          prefix = bytearray(''.join(''.join(p.read_text().split()) for p in prefix_paths).encode())
          if len(prefix) != 80000 or prefix[60009] != ord('o'):
              raise SystemExit(f'Unexpected prefix: length={len(prefix)} byte60009={prefix[60009] if len(prefix)>60009 else None}')
          prefix[60009] = ord('O')

          suffix_paths = (
              [Path(f'.final-suffix-hex-v2/chunk-{i:02d}') for i in range(4)] +
              [Path('.final-suffix-hex/chunk-05')] +
              [Path(f'.final-suffix-hex/chunk-{i:02d}') for i in range(10, 15)]
          )
          suffix_hex = ''.join(''.join(p.read_text().split()) for p in suffix_paths)
          suffix = bytes.fromhex(suffix_hex)

          outer_paths = sorted(Path('.final-suffix-outer-small').glob('chunk-*'))
          outer = ''.join(''.join(p.read_text().split()) for p in outer_paths).encode()
          remainder = base64.b64decode(outer, validate=True)

          payload = bytes(prefix) + suffix + remainder
          archive = base64.b64decode(payload, validate=True)
          report = {
              'prefix_length': len(prefix),
              'suffix_hex_length': len(suffix_hex),
              'suffix_length': len(suffix),
              'outer_count': len(outer_paths),
              'outer_length': len(outer),
              'remainder_length': len(remainder),
              'payload_length': len(payload),
              'payload_sha256': hashlib.sha256(payload).hexdigest(),
              'archive_length': len(archive),
              'archive_sha256': hashlib.sha256(archive).hexdigest(),
          }
          Path('final-v3-diagnostics/reconstruction.json').write_text(json.dumps(report, indent=2) + '\n')
          archive_path = Path('final-v3-diagnostics/Libre-Remote-2.0-final-source.tar.gz')
          archive_path.write_bytes(archive)

          expected_payload = '0cf0947a8b46c5cf8bc95a9ede0ac947cac515f0708724921733f14c83081b1e'
          expected_archive = '5f537a05fd3f6615edda498563210d51e7549ad81849a7fd48039f63c3facfe4'
          if report['payload_sha256'] != expected_payload or report['archive_sha256'] != expected_archive:
              raise SystemExit(f'Checksum mismatch: {report}')

          with tarfile.open(archive_path, 'r:gz') as tar:
              names = tar.getnames()
              if not names or any(name.startswith('/') or '..' in Path(name).parts for name in names):
                  raise SystemExit('Unsafe archive path')
              Path('final-v3-diagnostics/archive-files.txt').write_text('\n'.join(names) + '\n')
          PY
          rm -rf lg-wifi-remote-app
          mkdir -p lg-wifi-remote-app
          tar -xzf final-v3-diagnostics/Libre-Remote-2.0-final-source.tar.gz -C lg-wifi-remote-app
          test -f lg-wifi-remote-app/settings.gradle.kts
          test -f lg-wifi-remote-app/app/build.gradle.kts
          echo "materialized=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Configure temporary test signing
        shell: bash
        run: |
          set -euo pipefail
          STORE_PASSWORD="$(openssl rand -hex 18)"
          KEY_PASSWORD="$STORE_PASSWORD"
          KEY_ALIAS="libre-remote-final-v3-test"
          echo "::add-mask::$STORE_PASSWORD"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/libre-remote-final-v3-test.jks" \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=Libre Remote Final V3 Test, OU=Open Source, O=Libre Remote Community, L=Rio de Janeiro, ST=RJ, C=BR"
          echo "LIBRE_KEYSTORE_PATH=$RUNNER_TEMP/libre-remote-final-v3-test.jks" >> "$GITHUB_ENV"
          echo "LIBRE_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "LIBRE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "LIBRE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Unit tests, release lint, APK and AAB
        id: android_build
        continue-on-error: true
        working-directory: lg-wifi-remote-app
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:lintRelease \
            :app:assembleRelease \
            :app:bundleRelease 2>&1 | tee build-final-v3.log

      - name: Persist build status
        if: always() && github.event_name == 'pull_request'
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.android_build.outcome }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p .ci-status
          python3 - <<'PY'
          from pathlib import Path
          import json, os, re
          path = Path('lg-wifi-remote-app/build-final-v3.log')
          log = path.read_text(errors='replace') if path.exists() else ''
          errors = []
          for line in log.splitlines():
              if re.search(r'(^e: | error: |FAILURE:|Execution failed for task|What went wrong)', line, re.I):
                  errors.append(line[:600])
              if len(errors) >= 100:
                  break
          Path('.ci-status/libre-remote-2-final-v3.json').write_text(json.dumps({
              'outcome': os.environ.get('BUILD_OUTCOME', 'unknown'),
              'head_sha': os.environ.get('HEAD_SHA', ''),
              'errors': errors,
          }, indent=2, ensure_ascii=False) + '\n')
          PY
          git config user.name "Libre Remote CI"
          git config user.email "actions@users.noreply.github.com"
          git add .ci-status/libre-remote-2-final-v3.json
          git commit -m "Record Libre Remote final v3 status [skip ci]" || true
          git push origin HEAD:${GITHUB_HEAD_REF}

      - name: Package successful build
        if: steps.android_build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-v3-output/source final-v3-output/store
          APK="lg-wifi-remote-app/app/build/outputs/apk/release/app-release.apk"
          AAB="lg-wifi-remote-app/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK" && test -s "$AAB"
          cp "$APK" final-v3-output/Libre-Remote-2.0.0-rc1.apk
          cp "$AAB" final-v3-output/Libre-Remote-2.0.0-rc1.aab
          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > final-v3-output/APK-SIGNATURE.txt
          sha256sum final-v3-output/*.apk final-v3-output/*.aab > final-v3-output/SHA256SUMS.txt
          rsync -a --exclude build --exclude .gradle --exclude .kotlin --exclude local.properties lg-wifi-remote-app/ final-v3-output/source/
          (cd final-v3-output && zip -qr Libre-Remote-2.0.0-rc1-source.zip source && rm -rf source)
          if [ -d lg-wifi-remote-app/store-listing ]; then
            cp -r lg-wifi-remote-app/store-listing/* final-v3-output/store/
            (cd final-v3-output && zip -qr Libre-Remote-2.0.0-rc1-play-store.zip store && rm -rf store)
          fi
          cp lg-wifi-remote-app/build-final-v3.log final-v3-output/BUILD-LOG.txt

      - name: Commit clean materialized source
        if: steps.reconstruct.outputs.materialized == 'true' && steps.android_build.outcome == 'success' && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Libre Remote CI"
          git config user.email "actions@users.noreply.github.com"
          rm -rf .final-overlay .final-overlay-hex .final-overlay-v2 .final-overlay-v3 .final-overlay-v4 .final-overlay-v5 .final-suffix-hex .final-suffix-hex-v2 .final-suffix-hex-v3 .final-suffix-hex-v4 .final-suffix-outer .final-suffix-outer-small .final-suffix-outer-small-v2 .final-source-v2
          rm -f lg-wifi-remote-app/.final-build-trigger
          git add -A
          git commit -m "Materialize validated Libre Remote 2.0 RC1 source [skip ci]"
          git push origin HEAD:${GITHUB_HEAD_REF}

      - name: Upload release candidate
        if: steps.android_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-2.0.0-final-v3-rc1
          path: final-v3-output/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-2.0.0-final-v3-diagnostics
          path: |
            final-v3-diagnostics/**
            lg-wifi-remote-app/build-final-v3.log
            lg-wifi-remote-app/app/build/reports/**
            .ci-status/libre-remote-2-final-v3.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce successful build
        if: steps.android_build.outcome != 'success'
        run: exit 1
