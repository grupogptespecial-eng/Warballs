name: Build and Promote Libre Remote 2 Final v4

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "lg-wifi-remote-app/**"
      - ".final-overlay/**"
      - ".final-suffix-hex/**"
      - ".final-suffix-hex-v2/**"
      - ".final-suffix-outer-small/**"
      - ".github/workflows/build-libre-remote-2-final-v4.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: libre-final-v4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Materialize exact source archive
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .final-overlay ]; then
            echo "materialized=false" >> "$GITHUB_OUTPUT"
            test -f lg-wifi-remote-app/settings.gradle.kts
            exit 0
          fi
          mkdir -p final-v4-diagnostics
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, tarfile
          prefix = bytearray(''.join(''.join(Path(f'.final-overlay/part-{i:02d}').read_text().split()) for i in range(10)).encode())
          if len(prefix) != 80000 or prefix[60009] != ord('o'):
              raise SystemExit(f'bad prefix {len(prefix)} {prefix[60009] if len(prefix)>60009 else None}')
          prefix[60009] = ord('O')
          suffix_paths = [Path(f'.final-suffix-hex-v2/chunk-{i:02d}') for i in range(4)]
          suffix_paths += [Path('.final-suffix-hex/chunk-05')]
          suffix_paths += [Path(f'.final-suffix-hex/chunk-{i:02d}') for i in range(10, 15)]
          suffix = bytes.fromhex(''.join(''.join(p.read_text().split()) for p in suffix_paths))
          outer_paths = sorted(Path('.final-suffix-outer-small').glob('chunk-*'))
          outer = ''.join(''.join(p.read_text().split()) for p in outer_paths).encode()
          remainder = base64.b64decode(outer, validate=True)
          payload = bytes(prefix) + suffix + remainder
          archive = base64.b64decode(payload, validate=True)
          report = {
              'prefix': len(prefix), 'suffix': len(suffix), 'outer_parts': len(outer_paths),
              'outer': len(outer), 'remainder': len(remainder), 'payload': len(payload),
              'payload_sha256': hashlib.sha256(payload).hexdigest(),
              'archive': len(archive), 'archive_sha256': hashlib.sha256(archive).hexdigest()
          }
          expected = {
              'payload_sha256': '0cf0947a8b46c5cf8bc95a9ede0ac947cac515f0708724921733f14c83081b1e',
              'archive_sha256': '5f537a05fd3f6615edda498563210d51e7549ad81849a7fd48039f63c3facfe4'
          }
          if any(report[k] != v for k, v in expected.items()):
              raise SystemExit(f'checksum mismatch: {report}')
          Path('final-v4-diagnostics/reconstruction.json').write_text(json.dumps(report, indent=2) + '\n')
          archive_path = Path('final-v4-diagnostics/source.tar.gz')
          archive_path.write_bytes(archive)
          with tarfile.open(archive_path, 'r:gz') as tar:
              names = tar.getnames()
              if not names or any(name.startswith('/') or '..' in Path(name).parts for name in names):
                  raise SystemExit('unsafe archive')
              Path('final-v4-diagnostics/files.txt').write_text('\n'.join(names) + '\n')
          PY
          rm -rf lg-wifi-remote-app
          mkdir -p lg-wifi-remote-app
          tar -xzf final-v4-diagnostics/source.tar.gz -C lg-wifi-remote-app
          test -f lg-wifi-remote-app/settings.gradle.kts
          echo "materialized=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Temporary signing
        shell: bash
        run: |
          set -euo pipefail
          P="$(openssl rand -hex 18)"; echo "::add-mask::$P"; A="libre-final-v4"
          keytool -genkeypair -keystore "$RUNNER_TEMP/key.jks" -storepass "$P" -keypass "$P" -alias "$A" -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=Libre Remote RC Test, O=Libre Remote Community, C=BR"
          echo "LIBRE_KEYSTORE_PATH=$RUNNER_TEMP/key.jks" >> "$GITHUB_ENV"
          echo "LIBRE_KEYSTORE_PASSWORD=$P" >> "$GITHUB_ENV"
          echo "LIBRE_KEY_ALIAS=$A" >> "$GITHUB_ENV"
          echo "LIBRE_KEY_PASSWORD=$P" >> "$GITHUB_ENV"

      - name: Test lint APK AAB
        working-directory: lg-wifi-remote-app
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease 2>&1 | tee build-v4.log

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-v4-output/source final-v4-output/store
          APK=lg-wifi-remote-app/app/build/outputs/apk/release/app-release.apk
          AAB=lg-wifi-remote-app/app/build/outputs/bundle/release/app-release.aab
          test -s "$APK" && test -s "$AAB"
          cp "$APK" final-v4-output/Libre-Remote-2.0.0-rc1.apk
          cp "$AAB" final-v4-output/Libre-Remote-2.0.0-rc1.aab
          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > final-v4-output/APK-SIGNATURE.txt
          sha256sum final-v4-output/*.apk final-v4-output/*.aab > final-v4-output/SHA256SUMS.txt
          rsync -a --exclude build --exclude .gradle --exclude .kotlin --exclude local.properties lg-wifi-remote-app/ final-v4-output/source/
          (cd final-v4-output && zip -qr Libre-Remote-2.0.0-rc1-source.zip source && rm -rf source)
          if [ -d lg-wifi-remote-app/store-listing ]; then
            cp -r lg-wifi-remote-app/store-listing/* final-v4-output/store/
            (cd final-v4-output && zip -qr Libre-Remote-2.0.0-rc1-play-store.zip store && rm -rf store)
          fi
          cp lg-wifi-remote-app/build-v4.log final-v4-output/BUILD-LOG.txt

      - name: Commit and promote validated clean source
        if: steps.source.outputs.materialized == 'true' && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Libre Remote CI"
          git config user.email "actions@users.noreply.github.com"
          rm -rf .final-overlay .final-overlay-hex .final-overlay-v2 .final-overlay-v3 .final-overlay-v4 .final-overlay-v5 .final-suffix-hex .final-suffix-hex-v2 .final-suffix-hex-v3 .final-suffix-hex-v4 .final-suffix-outer .final-suffix-outer-small .final-suffix-outer-small-v2 .final-source-v2
          rm -f lg-wifi-remote-app/.final-build-trigger
          git add -A
          git commit -m "Materialize validated Libre Remote 2.0 RC1 source [skip ci]"
          git push origin HEAD:${GITHUB_HEAD_REF}
          git push origin HEAD:refs/heads/release/libre-remote-2.0.0-rc1-source --force

      - uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-2.0.0-final-v4-rc1
          path: final-v4-output/*
          if-no-files-found: error
          retention-days: 30

      - name: Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-2.0.0-final-v4-diagnostics
          path: |
            final-v4-diagnostics/**
            lg-wifi-remote-app/build-v4.log
            lg-wifi-remote-app/app/build/reports/**
          if-no-files-found: warn
          retention-days: 14
