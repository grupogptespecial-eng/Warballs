name: Final Build From Verified Source

on:
  push:
    branches: [feature/libre-remote-2-product-foundation]
    paths: [".github/workflows/final-build-verified-source.yml"]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: libre-remote-2-verified-final
  cancel-in-progress: true

jobs:
  final-build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/libre-remote-2-product-foundation
          fetch-depth: 0

      - name: Materialize exact reviewed source
        id: source
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_id=8269145198
          curl --fail-with-body -sSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" \
            -o /tmp/source.zip
          rm -rf /tmp/source && mkdir -p /tmp/source
          unzip -q /tmp/source.zip -d /tmp/source
          archive=$(find /tmp/source -type f -name reconstructed.tar.gz -print -quit)
          test -n "$archive"
          python3 - "$archive" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          data = bytearray(path.read_bytes())
          fixes = ((63805, 0o367, 0o365), (63806, 0o66, 0o166))
          for offset, old, new in fixes:
              if data[offset] != old:
                  raise SystemExit(f"Unexpected byte at {offset}: {data[offset]:#o}")
              data[offset] = new
          path.write_bytes(data)
          PY
          echo "5f537a05fd3f6615edda498563210d51e7549ad81849a7fd48039f63c3facfe4  $archive" | sha256sum -c -
          tar -tzf "$archive" > /tmp/source-files.txt
          tar -xzf "$archive" -C lg-wifi-remote-app
          rm -rf lg-wifi-remote-app/app/schemas
          mkdir -p lg-wifi-remote-app/app/schemas
          rm -rf .final-b64 .final-materialize .final-overlay* .final-source* .final-suffix*
          rm -f lg-wifi-remote-app/.*trigger* lg-wifi-remote-app/.universal-*
          for file in ProductDatabase.kt CommandScheduler.kt MacroEngine.kt RemoteViewModelPermissions.kt WakeOnLan.kt; do
            test -f "lg-wifi-remote-app/app/src/main/java/com/geronimo/controlelgwifi/$file"
          done
          test -f lg-wifi-remote-app/app/proguard-rules.pro
          test -f lg-wifi-remote-app/app/src/main/res/xml/network_security_config.xml
          test -f lg-wifi-remote-app/ARCHITECTURE.md

      - uses: actions/setup-java@v4
        if: steps.source.outcome == 'success'
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        if: steps.source.outcome == 'success'
      - name: Install Android SDK
        if: steps.source.outcome == 'success'
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        if: steps.source.outcome == 'success'
        with:
          gradle-version: "8.10.2"

      - name: Generate Gradle wrapper
        if: steps.source.outcome == 'success'
        working-directory: lg-wifi-remote-app
        run: |
          gradle wrapper --gradle-version 8.10.2 --distribution-type bin
          chmod +x gradlew

      - name: Configure temporary signing
        if: steps.source.outcome == 'success'
        shell: bash
        run: |
          password=$(openssl rand -hex 18)
          alias=libre-remote-final-test
          echo "::add-mask::$password"
          keytool -genkeypair -keystore "$RUNNER_TEMP/test.jks" -storepass "$password" -keypass "$password" -alias "$alias" -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=Libre Remote Final Test, OU=Open Source, O=Libre Remote Community, L=Rio de Janeiro, ST=RJ, C=BR"
          echo "LIBRE_KEYSTORE_PATH=$RUNNER_TEMP/test.jks" >> "$GITHUB_ENV"
          echo "LIBRE_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "LIBRE_KEY_ALIAS=$alias" >> "$GITHUB_ENV"
          echo "LIBRE_KEY_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Unit tests, lint, APK and AAB
        id: build
        if: steps.source.outcome == 'success'
        continue-on-error: true
        working-directory: lg-wifi-remote-app
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease 2>&1 | tee build-final.log

      - name: Package successful release candidate
        id: package
        if: steps.source.outcome == 'success' && steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/source output/store
          APK=lg-wifi-remote-app/app/build/outputs/apk/release/app-release.apk
          AAB=lg-wifi-remote-app/app/build/outputs/bundle/release/app-release.aab
          cp "$APK" output/Libre-Remote-2.0.0-rc1-test.apk
          cp "$AAB" output/Libre-Remote-2.0.0-rc1-test.aab
          signer=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$signer" verify --verbose --print-certs "$APK" > output/APK-SIGNATURE.txt
          sha256sum output/*.apk output/*.aab > output/SHA256SUMS.txt
          rsync -a --exclude build --exclude .gradle --exclude .kotlin --exclude local.properties lg-wifi-remote-app/ output/source/
          (cd output && zip -qr Libre-Remote-2.0.0-rc1-source.zip source && rm -rf source)
          cp -r lg-wifi-remote-app/store-listing/. output/store/
          printf 'Final reviewed graphics are delivered separately.\n' > output/store/GRAPHICS-NOTE.txt
          (cd output && zip -qr Libre-Remote-2.0.0-play-store-materials.zip store && rm -rf store)
          cp lg-wifi-remote-app/build-final.log output/BUILD-LOG.txt
          cp lg-wifi-remote-app/app/build/reports/lint-results-release.html output/LINT-REPORT.html
          printf 'Temporary CI test signature; rebuild with the permanent Play upload key for production.\n' > output/IMPORTANT-SIGNING.txt
          {
            echo '# Libre Remote 2 CI success'
            echo
            echo "Run: $GITHUB_RUN_ID"
            echo 'Validated: source hash, unit tests, release lint, APK, AAB and APK signature.'
            echo
            cat output/SHA256SUMS.txt
          } > lg-wifi-remote-app/CI_SUCCESS.md
          rm -f lg-wifi-remote-app/CI_FAILURE.txt

      - name: Write failure marker
        if: always() && (steps.source.outcome != 'success' || steps.build.outcome == 'failure' || steps.package.outcome == 'failure')
        shell: bash
        run: |
          mkdir -p lg-wifi-remote-app
          rm -f lg-wifi-remote-app/CI_SUCCESS.md
          {
            echo '# Libre Remote 2 CI failure'
            echo
            echo "Run: $GITHUB_RUN_ID"
            echo "Source outcome: ${{ steps.source.outcome }}"
            echo "Build outcome: ${{ steps.build.outcome }}"
            echo "Package outcome: ${{ steps.package.outcome }}"
            echo
            echo '```text'
            if [ -f lg-wifi-remote-app/build-final.log ]; then
              grep -nE '(^e:| error: |FAILURE|What went wrong|Unresolved reference|Compilation error|Exception)' lg-wifi-remote-app/build-final.log | tail -n 180 || true
              tail -n 280 lg-wifi-remote-app/build-final.log || true
            else
              echo 'Failure occurred before the Gradle build log was created.'
            fi
            echo '```'
          } > lg-wifi-remote-app/CI_FAILURE.txt

      - name: Commit result to product branch
        if: always()
        shell: bash
        run: |
          git config user.name "Libre Remote CI"
          git config user.email "actions@users.noreply.github.com"
          if [ -f lg-wifi-remote-app/CI_SUCCESS.md ]; then
            git add -A
            message='Materialize validated Libre Remote 2.0 RC1 product [verified-ci]'
          else
            git add lg-wifi-remote-app/CI_FAILURE.txt
            message='Record verified Libre Remote final build failure [verified-ci]'
          fi
          if ! git diff --cached --quiet; then
            git commit -m "$message"
            git push origin HEAD:feature/libre-remote-2-product-foundation
          fi

      - uses: actions/upload-artifact@v4
        if: steps.package.outcome == 'success'
        with:
          name: Libre-Remote-2.0.0-RC1-final-candidate
          path: output/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-2.0.0-verified-final-reports
          path: |
            /tmp/source-files.txt
            lg-wifi-remote-app/build-final.log
            lg-wifi-remote-app/app/build/reports/**
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve failing status
        if: always() && steps.package.outcome != 'success'
        run: exit 1
