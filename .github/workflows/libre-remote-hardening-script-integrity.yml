name: Libre Remote Hardening Script Integrity

on:
  workflow_dispatch:
  pull_request:
    branches: [release/libre-remote-2.1.3-rc5.4-android-tested]
    paths:
      - 'scripts/*libre_remote*.py'
      - 'protocol-lab/**'
      - '.github/workflows/libre-remote-hardening-script-integrity.yml'
      - '.github/workflows/libre-remote-release-signing.yml'
      - '.github/workflows/libre-remote-clean-install.yml'
      - '.github/workflows/libre-remote-apple-layout.yml'
      - '.github/workflows/libre-remote-protocol-client-integration.yml'
      - '.github/workflows/libre-remote-runtime-security.yml'
      - '.github/workflows/libre-remote-canonicalize-source.yml'

permissions:
  contents: read

jobs:
  python-generators:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile all Libre Remote Python generators and lab fixtures
        run: |
          set -euo pipefail
          mapfile -t files < <(find scripts protocol-lab -type f -name '*.py' \( -name '*libre_remote*' -o -path 'protocol-lab/*' \) | sort)
          test "${#files[@]}" -gt 0
          printf '%s\n' "${files[@]}"
          python3 -m py_compile "${files[@]}"
      - name: Protocol lab self-test
        run: |
          set -euo pipefail
          python3 protocol-lab/libre_remote_lab.py --self-test --json | tee protocol-lab-self-test.json
      - name: Reject accidental production test-store default
        run: |
          set -euo pipefail
          ! grep -R --line-number 'createPlatformSecureStore(): SecureStore = TestMemorySecureStore' scripts
          grep -q 'LIBRE_REMOTE_TEST_SECURE_STORE' scripts/enable_libre_remote_test_secure_store.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Libre-Remote-Hardening-Script-Integrity
          path: protocol-lab-self-test.json
          retention-days: 14
