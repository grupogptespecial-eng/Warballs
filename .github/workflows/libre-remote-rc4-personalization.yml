name: Build Libre Remote RC4 Personalization

on:
  push:
    branches:
      - stability/libre-remote-2.0.0-rc4-personalization-20260809
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct reviewed RC4 source
        working-directory: lg-wifi-remote-app
        shell: bash
        run: |
          set -euo pipefail
          git apply --check --whitespace=error stability-rc2.patch
          git apply --whitespace=error stability-rc2.patch
          git apply --check --whitespace=error controls-rc3.patch
          git apply --whitespace=error controls-rc3.patch
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          source = Path("rc4-overlay/part-02.b64").read_bytes()
          expected = "236d5db836bfb34be0fda959111edcdc377d3fbe"

          def blob_sha(data: bytes) -> str:
              header = f"blob {len(data)}\0".encode()
              return hashlib.sha1(header + data).hexdigest()

          repaired = source
          if blob_sha(repaired) != expected:
              if len(source) != 7001:
                  raise SystemExit(f"Unexpected RC4 part-02 size: {len(source)}")
              repaired = None
              for index in range(len(source)):
                  candidate = source[:index] + source[index + 1:]
                  if blob_sha(candidate) == expected:
                      repaired = candidate
                      print(f"Repaired one transport byte at offset {index}")
                      break
              if repaired is None:
                  raise SystemExit("Could not reconstruct exact RC4 part-02 blob")
          Path("/tmp/rc4-part-02.b64").write_bytes(repaired)
          PY
          cat \
            rc4-overlay/part-00.b64 \
            rc4-overlay/part-01.b64 \
            /tmp/rc4-part-02.b64 \
            rc4-overlay/part-03.b64 \
            rc4-overlay/part-04.b64 \
            rc4-overlay/part-05.b64 \
            rc4-overlay/part-06.b64 \
            rc4-overlay/part-07.b64 > /tmp/rc4-overlay.b64
          base64 -d /tmp/rc4-overlay.b64 > /tmp/rc4-overlay.tar.gz
          echo "9605dc634c304dd17834ce22cde4e1b61406f4df6157bf929cd22f025dc157f5  /tmp/rc4-overlay.tar.gz" | sha256sum -c -
          tar -xzf /tmp/rc4-overlay.tar.gz -C .
          git diff --check
          git diff --stat

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Generate temporary sideload signing key
        shell: bash
        run: |
          set -euo pipefail
          PASSWORD="$(openssl rand -hex 18)"
          ALIAS="libre-remote-sideload"
          echo "::add-mask::$PASSWORD"
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/libre-remote-sideload.jks" \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=Libre Remote Sideload, OU=RC4 Personalization, O=Libre Remote, L=Rio de Janeiro, ST=RJ, C=BR"
          echo "LIBRE_KEYSTORE_PATH=$GITHUB_WORKSPACE/libre-remote-sideload.jks" >> "$GITHUB_ENV"
          echo "LIBRE_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "LIBRE_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "LIBRE_KEY_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

      - name: Unit tests, release lint and signed APK
        working-directory: lg-wifi-remote-app
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:lintRelease \
            :app:assembleRelease 2>&1 | tee rc4-personalization-build.log

      - name: Verify APK and package artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/source
          APK="lg-wifi-remote-app/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          cp "$APK" output/Libre-Remote-2.0.0-rc4-personalization.apk
          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs output/Libre-Remote-2.0.0-rc4-personalization.apk > output/APK-SIGNATURE.txt
          sha256sum output/Libre-Remote-2.0.0-rc4-personalization.apk > output/SHA256SUMS.txt
          cp lg-wifi-remote-app/rc4-personalization-build.log output/
          rsync -a \
            --exclude build \
            --exclude .gradle \
            --exclude local.properties \
            --exclude stability-rc2.patch \
            --exclude controls-rc3.patch \
            --exclude rc4-core.patch \
            --exclude rc4-overlay \
            lg-wifi-remote-app/ output/source/
          (cd output && zip -qr Libre-Remote-2.0.0-rc4-personalization-source.zip source && rm -rf source)
          ls -lh output

      - name: Upload RC4 personalization build
        uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-2.0.0-rc4-personalization
          path: output/*
          if-no-files-found: error
          retention-days: 30
