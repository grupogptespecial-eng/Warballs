name: Build Libre Remote 2 Product

on:
  push:
    branches:
      - feature/libre-remote-2-product-foundation
    paths:
      - "lg-wifi-remote-app/**"
      - ".github/workflows/build-libre-remote-2-product-direct.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: libre-remote-2-product-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify final source is materialized
        run: |
          test -s lg-wifi-remote-app/app/src/main/java/com/geronimo/controlelgwifi/ProductDatabase.kt
          test -s lg-wifi-remote-app/README.md
          test -s lg-wifi-remote-app/store-listing/privacy-policy.html
          ! find . -maxdepth 1 -type d -name '.final-*' | grep -q .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Configure temporary validation signing
        shell: bash
        run: |
          set -euo pipefail
          STORE_PASSWORD="$(openssl rand -hex 18)"
          KEY_PASSWORD="$STORE_PASSWORD"
          KEY_ALIAS="libre-remote-product-validation"
          echo "::add-mask::$STORE_PASSWORD"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/libre-product-validation.jks" \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=Libre Remote Product Validation, OU=Open Source, O=Libre Remote Community, L=Rio de Janeiro, ST=RJ, C=BR"
          echo "LIBRE_KEYSTORE_PATH=$RUNNER_TEMP/libre-product-validation.jks" >> "$GITHUB_ENV"
          echo "LIBRE_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "LIBRE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "LIBRE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Tests, release lint, APK and AAB
        working-directory: lg-wifi-remote-app
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:lintRelease \
            :app:assembleRelease \
            :app:bundleRelease 2>&1 | tee build-product.log

      - name: Verify and package candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/source dist/store
          APK=lg-wifi-remote-app/app/build/outputs/apk/release/app-release.apk
          AAB=lg-wifi-remote-app/app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"; test -s "$AAB"
          cp "$APK" dist/Libre-Remote-2.0.0-rc1.apk
          cp "$AAB" dist/Libre-Remote-2.0.0-rc1.aab
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs dist/Libre-Remote-2.0.0-rc1.apk > dist/APK-SIGNATURE.txt
          sha256sum dist/Libre-Remote-2.0.0-rc1.apk dist/Libre-Remote-2.0.0-rc1.aab > dist/SHA256SUMS.txt
          rsync -a --exclude build --exclude .gradle --exclude .kotlin --exclude local.properties lg-wifi-remote-app/ dist/source/
          (cd dist && zip -qr Libre-Remote-2.0.0-rc1-source.zip source && rm -rf source)
          cp -r lg-wifi-remote-app/store-listing/* dist/store/
          (cd dist && zip -qr Libre-Remote-2.0.0-play-store.zip store && rm -rf store)
          cp lg-wifi-remote-app/build-product.log dist/BUILD-LOG.txt
          ls -lh dist

      - name: Upload product candidate
        uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-2.0.0-product-candidate
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-2.0.0-validation-reports
          path: |
            lg-wifi-remote-app/build-product.log
            lg-wifi-remote-app/app/build/reports/**
          if-no-files-found: warn
          retention-days: 14
