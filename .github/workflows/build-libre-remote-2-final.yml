name: Build Libre Remote 2 Final

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "lg-wifi-remote-app/**"
      - ".final-overlay/**"
      - ".final-suffix-hex/**"
      - ".final-suffix-outer-small/**"
      - ".github/workflows/build-libre-remote-2-final.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: libre-remote-2-final-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-package-materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout product branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Reconstruct final source when needed
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-diagnostics

          if [ ! -d .final-overlay ] || [ ! -d .final-suffix-outer-small ]; then
            echo "materialized=false" >> "$GITHUB_OUTPUT"
            test -f lg-wifi-remote-app/settings.gradle.kts
            echo "Final source is already materialized."
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import tarfile

          prefix_paths = [Path(f'.final-overlay/part-{i:02d}') for i in range(10)]
          for path in prefix_paths:
              if not path.is_file():
                  raise SystemExit(f'Missing prefix part: {path}')

          prefix = bytearray(''.join(''.join(p.read_text().split()) for p in prefix_paths).encode())
          if len(prefix) != 80000:
              raise SystemExit(f'Unexpected prefix length: {len(prefix)}')
          if prefix[60009] != ord('o'):
              raise SystemExit(f'Unexpected prefix byte at 60009: {prefix[60009]}')
          prefix[60009] = ord('O')

          first_suffix_paths = [Path(f'.final-suffix-hex/chunk-{i:02d}') for i in range(15)]
          for path in first_suffix_paths:
              if not path.is_file():
                  raise SystemExit(f'Missing suffix hex part: {path}')
          first_hex = ''.join(''.join(p.read_text().split()) for p in first_suffix_paths)
          first_suffix = bytes.fromhex(first_hex)
          if len(first_suffix) != 22500:
              raise SystemExit(f'Unexpected first suffix length: {len(first_suffix)}')
          if hashlib.sha256(first_suffix).hexdigest() != 'd33a57554371a43dcada3cf86ea881e29896ac5c477830a1fd1bbc071ca876b0':
              raise SystemExit('First suffix checksum mismatch')

          outer_paths = sorted(Path('.final-suffix-outer-small').glob('chunk-*'))
          if len(outer_paths) != 44:
              raise SystemExit(f'Expected 44 remainder chunks, found {len(outer_paths)}')
          outer = ''.join(''.join(p.read_text().split()) for p in outer_paths).encode()
          if len(outer) != 17216:
              raise SystemExit(f'Unexpected outer remainder length: {len(outer)}')
          if hashlib.sha256(outer).hexdigest() != '5f2c5ffab2920821271060689e289255a16b2adb366b18ab7e126c32fc700d3b':
              raise SystemExit('Outer remainder checksum mismatch')
          remainder = base64.b64decode(outer, validate=True)
          if len(remainder) != 12912:
              raise SystemExit(f'Unexpected remainder length: {len(remainder)}')
          if hashlib.sha256(remainder).hexdigest() != '88a63d6791218ca4f779568dbd88d11bff3420e0004457b569426b23c7d0f31b':
              raise SystemExit('Remainder checksum mismatch')

          payload = bytes(prefix) + first_suffix + remainder
          if len(payload) != 115412:
              raise SystemExit(f'Unexpected final base64 length: {len(payload)}')
          if hashlib.sha256(payload).hexdigest() != '0cf0947a8b46c5cf8bc95a9ede0ac947cac515f0708724921733f14c83081b1e':
              raise SystemExit('Final base64 checksum mismatch')

          archive = base64.b64decode(payload, validate=True)
          if hashlib.sha256(archive).hexdigest() != '5f537a05fd3f6615edda498563210d51e7549ad81849a7fd48039f63c3facfe4':
              raise SystemExit('Final archive checksum mismatch')

          archive_path = Path('final-diagnostics/Libre-Remote-2.0-final-source-patch.tar.gz')
          archive_path.write_bytes(archive)

          with tarfile.open(archive_path, 'r:gz') as tar:
              names = tar.getnames()
              if not names or any(name.startswith('/') or '..' in Path(name).parts for name in names):
                  raise SystemExit('Unsafe archive path detected')
              Path('final-diagnostics/archive-files.txt').write_text('\n'.join(names) + '\n')
              tar.extractall('.', filter='data')

          print('Final source reconstructed and extracted successfully.')
          PY

          echo "materialized=true" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Configure temporary release signing
        shell: bash
        run: |
          set -euo pipefail
          STORE_PASSWORD="$(openssl rand -hex 18)"
          KEY_PASSWORD="$STORE_PASSWORD"
          KEY_ALIAS="libre-remote-final-test"
          echo "::add-mask::$STORE_PASSWORD"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/libre-remote-final-test.jks" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=Libre Remote Final Test, OU=Open Source, O=Libre Remote Community, L=Rio de Janeiro, ST=RJ, C=BR"
          echo "LIBRE_KEYSTORE_PATH=$RUNNER_TEMP/libre-remote-final-test.jks" >> "$GITHUB_ENV"
          echo "LIBRE_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "LIBRE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "LIBRE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Run unit tests, lint and release builds
        working-directory: lg-wifi-remote-app
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:lintRelease \
            :app:assembleRelease \
            :app:bundleRelease 2>&1 | tee build-final.log

      - name: Verify and package final candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-output/source final-output/store
          APK="lg-wifi-remote-app/app/build/outputs/apk/release/app-release.apk"
          AAB="lg-wifi-remote-app/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          cp "$APK" final-output/Libre-Remote-2.0.0-rc1.apk
          cp "$AAB" final-output/Libre-Remote-2.0.0-rc1.aab
          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > final-output/APK-SIGNATURE.txt
          sha256sum final-output/*.apk final-output/*.aab > final-output/SHA256SUMS.txt
          rsync -a \
            --exclude build --exclude .gradle --exclude .kotlin --exclude local.properties \
            lg-wifi-remote-app/ final-output/source/
          (cd final-output && zip -qr Libre-Remote-2.0.0-rc1-source.zip source && rm -rf source)
          if [ -d lg-wifi-remote-app/store-listing ]; then
            cp -r lg-wifi-remote-app/store-listing/* final-output/store/
            (cd final-output && zip -qr Libre-Remote-2.0.0-rc1-play-store.zip store && rm -rf store)
          fi
          cp lg-wifi-remote-app/build-final.log final-output/BUILD-LOG.txt
          ls -lh final-output

      - name: Commit clean materialized source
        if: steps.materialize.outputs.materialized == 'true' && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Libre Remote CI"
          git config user.email "actions@users.noreply.github.com"
          rm -rf \
            .final-overlay \
            .final-overlay-hex \
            .final-overlay-v2 \
            .final-overlay-v3 \
            .final-overlay-v4 \
            .final-overlay-v5 \
            .final-suffix-hex \
            .final-suffix-outer \
            .final-suffix-outer-small \
            .final-source-v2
          rm -f lg-wifi-remote-app/.final-build-trigger
          git add -A lg-wifi-remote-app .final-overlay .final-overlay-hex .final-overlay-v2 .final-overlay-v3 .final-overlay-v4 .final-overlay-v5 .final-suffix-hex .final-suffix-outer .final-suffix-outer-small .final-source-v2 2>/dev/null || git add -A
          git commit -m "Materialize Libre Remote 2.0 RC1 final source [skip ci]"
          git push origin HEAD:${GITHUB_HEAD_REF}

      - name: Upload final candidate
        uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-2.0.0-rc1
          path: final-output/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-2.0.0-final-diagnostics
          path: |
            final-diagnostics/**
            lg-wifi-remote-app/build-final.log
            lg-wifi-remote-app/app/build/reports/**
          if-no-files-found: warn
          retention-days: 14
