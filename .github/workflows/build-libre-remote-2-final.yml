name: Build Libre Remote 2 Final

on:
  pull_request:
    paths:
      - "lg-wifi-remote-app/**"
      - ".final-overlay/**"
      - ".final-overlay-hex/**"
      - ".github/workflows/build-libre-remote-2-final.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assemble and extract final source overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-diagnostics
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, re, sys

          root = Path('.final-overlay')
          candidates = [p for p in root.iterdir() if p.is_file() and (p.name.startswith('part-') or p.name.startswith('parts-'))]
          def order(path: Path):
              nums = [int(x) for x in re.findall(r'\d+', path.name)]
              return nums or [10**9]
          candidates.sort(key=order)
          if not candidates:
              raise SystemExit('No final overlay parts found')

          chunks = []
          for path in candidates:
              text = ''.join(path.read_text().split())
              chunks.append(text)
              print(f'{path}: {len(text)} base64 chars')
          payload = ''.join(chunks)
          Path('final-diagnostics/assembled.b64').write_text(payload)
          print('assembled base64 chars:', len(payload))
          print('assembled sha256:', hashlib.sha256(payload.encode()).hexdigest())

          try:
              raw = base64.b64decode(payload, validate=True)
          except Exception as exc:
              print('base64 validation failed:', repr(exc))
              raise
          Path('final-diagnostics/final-overlay.tar.gz').write_bytes(raw)
          print('archive bytes:', len(raw))
          print('archive sha256:', hashlib.sha256(raw).hexdigest())
          try:
              gzip.decompress(raw)
          except Exception as exc:
              print('gzip validation failed:', repr(exc))
              raise
          PY
          tar -tzf final-diagnostics/final-overlay.tar.gz | tee final-diagnostics/archive-files.txt
          tar -xzf final-diagnostics/final-overlay.tar.gz -C "$GITHUB_WORKSPACE"

      - name: Materialize source on product branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Libre Remote CI"
          git config user.email "actions@users.noreply.github.com"
          git add lg-wifi-remote-app .github || true
          if ! git diff --cached --quiet; then
            git commit -m "Materialize Libre Remote 2 final source [skip ci]"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Configure temporary release signing
        shell: bash
        run: |
          set -euo pipefail
          STORE_PASSWORD="$(openssl rand -hex 18)"
          KEY_PASSWORD="$STORE_PASSWORD"
          KEY_ALIAS="libre-remote-final-test"
          echo "::add-mask::$STORE_PASSWORD"
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/libre-remote-final-test.jks" \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=Libre Remote Final Test, OU=Open Source, O=Libre Remote Community, L=Rio de Janeiro, ST=RJ, C=BR"
          echo "LIBRE_KEYSTORE_PATH=$GITHUB_WORKSPACE/libre-remote-final-test.jks" >> "$GITHUB_ENV"
          echo "LIBRE_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "LIBRE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "LIBRE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Run unit tests, lint and release builds
        working-directory: lg-wifi-remote-app
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:lintRelease \
            :app:assembleRelease \
            :app:bundleRelease 2>&1 | tee build-final.log

      - name: Verify and package final candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-output/source final-output/store
          APK="lg-wifi-remote-app/app/build/outputs/apk/release/app-release.apk"
          AAB="lg-wifi-remote-app/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          cp "$APK" final-output/Libre-Remote-2.0.0-final-candidate.apk
          cp "$AAB" final-output/Libre-Remote-2.0.0-final-candidate.aab
          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > final-output/APK-SIGNATURE.txt
          sha256sum final-output/*.apk final-output/*.aab > final-output/SHA256SUMS.txt
          rsync -a \
            --exclude build --exclude .gradle --exclude .kotlin --exclude local.properties \
            lg-wifi-remote-app/ final-output/source/
          (cd final-output && zip -qr Libre-Remote-2.0.0-source.zip source && rm -rf source)
          if [ -d lg-wifi-remote-app/store-listing ]; then
            cp -r lg-wifi-remote-app/store-listing/* final-output/store/
            (cd final-output && zip -qr Libre-Remote-2.0.0-play-store.zip store && rm -rf store)
          fi
          cp lg-wifi-remote-app/build-final.log final-output/BUILD-LOG.txt
          ls -lh final-output

      - name: Upload final candidate
        uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-2.0.0-final-candidate
          path: final-output/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-2.0.0-final-diagnostics
          path: |
            final-diagnostics/**
            lg-wifi-remote-app/build-final.log
            lg-wifi-remote-app/app/build/reports/**
          if-no-files-found: warn
          retention-days: 14
