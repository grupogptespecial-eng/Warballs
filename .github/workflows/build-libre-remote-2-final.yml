name: Build Libre Remote 2 Final

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "lg-wifi-remote-app/**"
      - ".final-*/**"
      - ".github/workflows/build-libre-remote-2-final.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: libre-remote-2-final-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-package-materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Recover and verify reviewed source archive
        id: materialize
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f lg-wifi-remote-app/app/src/main/java/com/geronimo/controlelgwifi/ProductDatabase.kt ]; then
            echo "materialized=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cp .final-materialize/finalize-v2.sh /tmp/finalize-libre-remote.sh
          artifact_id=""
          for attempt in $(seq 1 30); do
            response=$(curl --fail-with-body -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/actions/artifacts?name=libre-final-payload-diagnostics&per_page=100")
            artifact_id=$(jq -r --arg sha "$HEAD_SHA" \
              '[.artifacts[] | select(.expired == false and .workflow_run.head_sha == $sha)] | sort_by(.created_at) | last | .id // empty' \
              <<<"$response")
            if [ -n "$artifact_id" ]; then break; fi
            echo "Waiting for source diagnostic artifact ($attempt/30)..."
            sleep 4
          done
          test -n "$artifact_id"

          curl --fail-with-body -sSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" \
            -o /tmp/source-diagnostic.zip
          rm -rf /tmp/source-diagnostic
          mkdir -p /tmp/source-diagnostic
          unzip -q /tmp/source-diagnostic.zip -d /tmp/source-diagnostic
          archive=$(find /tmp/source-diagnostic -type f -name reconstructed.tar.gz -print -quit)
          test -n "$archive"

          python3 - "$archive" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          data = bytearray(path.read_bytes())
          expected = {63805: 0o367, 63806: 0o66}
          replacement = {63805: 0o365, 63806: 0o166}
          for offset, value in expected.items():
              if data[offset] != value:
                  raise SystemExit(f"Unexpected byte at {offset}: {data[offset]:#o}")
              data[offset] = replacement[offset]
          path.write_bytes(data)
          PY
          echo "5f537a05fd3f6615edda498563210d51e7549ad81849a7fd48039f63c3facfe4  $archive" | sha256sum -c -
          tar -tzf "$archive" > /tmp/libre-remote-final-files.txt
          mkdir -p lg-wifi-remote-app
          tar -xzf "$archive" -C lg-wifi-remote-app
          bash /tmp/finalize-libre-remote.sh "$GITHUB_WORKSPACE"
          rm -rf .final-b64 .final-materialize .final-overlay* .final-source* .final-suffix*
          echo "materialized=true" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Generate Gradle wrapper
        working-directory: lg-wifi-remote-app
        run: |
          gradle wrapper --gradle-version 8.10.2 --distribution-type bin
          chmod +x gradlew
          ./gradlew --version

      - name: Configure temporary release signing
        shell: bash
        run: |
          set -euo pipefail
          STORE_PASSWORD="$(openssl rand -hex 18)"
          KEY_PASSWORD="$STORE_PASSWORD"
          KEY_ALIAS="libre-remote-final-test"
          echo "::add-mask::$STORE_PASSWORD"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/libre-remote-final-test.jks" \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=Libre Remote Final Test, OU=Open Source, O=Libre Remote Community, L=Rio de Janeiro, ST=RJ, C=BR"
          echo "LIBRE_KEYSTORE_PATH=$RUNNER_TEMP/libre-remote-final-test.jks" >> "$GITHUB_ENV"
          echo "LIBRE_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "LIBRE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "LIBRE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Unit tests, release lint, APK and AAB
        working-directory: lg-wifi-remote-app
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:lintRelease \
            :app:assembleRelease \
            :app:bundleRelease 2>&1 | tee build-final.log

      - name: Verify and package final candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-output/source final-output/store
          APK="lg-wifi-remote-app/app/build/outputs/apk/release/app-release.apk"
          AAB="lg-wifi-remote-app/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK" && test -s "$AAB"
          cp "$APK" final-output/Libre-Remote-2.0.0-rc1-test.apk
          cp "$AAB" final-output/Libre-Remote-2.0.0-rc1-test.aab
          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > final-output/APK-SIGNATURE.txt
          sha256sum final-output/*.apk final-output/*.aab > final-output/SHA256SUMS.txt
          rsync -a --exclude build --exclude .gradle --exclude .kotlin --exclude local.properties lg-wifi-remote-app/ final-output/source/
          (cd final-output && zip -qr Libre-Remote-2.0.0-rc1-source.zip source && rm -rf source)
          if [ -d lg-wifi-remote-app/store-listing ]; then
            cp -r lg-wifi-remote-app/store-listing/. final-output/store/
            printf 'Final reviewed graphics are delivered separately from the source transport.\n' > final-output/store/GRAPHICS-NOTE.txt
            (cd final-output && zip -qr Libre-Remote-2.0.0-play-store-materials.zip store && rm -rf store)
          fi
          cp lg-wifi-remote-app/build-final.log final-output/BUILD-LOG.txt
          cp lg-wifi-remote-app/app/build/reports/lint-results-release.html final-output/LINT-REPORT.html
          printf 'Temporary CI test signature. Rebuild the unchanged tagged source with the permanent Play upload key.\n' > final-output/IMPORTANT-SIGNING.txt

      - name: Commit clean source after successful validation
        if: steps.materialize.outputs.materialized == 'true' && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Libre Remote CI"
          git config user.email "actions@users.noreply.github.com"
          rm -f lg-wifi-remote-app/.*trigger* lg-wifi-remote-app/.universal-*
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Materialize validated Libre Remote 2.0 RC1 source [skip ci]"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Upload final candidate
        uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-2.0.0-RC1-final-candidate
          path: final-output/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-2.0.0-final-diagnostics
          path: |
            /tmp/libre-remote-final-files.txt
            lg-wifi-remote-app/build-final.log
            lg-wifi-remote-app/app/build/reports/**
          if-no-files-found: warn
          retention-days: 14
