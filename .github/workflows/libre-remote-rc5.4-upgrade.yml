name: Libre Remote RC5.3 to RC5.4 Upgrade

on:
  push:
    branches: [fix/libre-remote-rc5.4-hardening]
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_ID: io.github.grupogptespecialeng.libreremote
  APP_ACTIVITY: io.github.grupogptespecialeng.libreremote.MainActivity

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build predecessor and hardened candidate
        run: |
          set -euo pipefail
          bash .rc5-universal/materialize-rc5.3.sh libre-remote-rc5.3
          bash .rc5-universal/materialize-rc5.4.sh libre-remote-rc5.4
          python3 scripts/harden_libre_remote_rc5_4.py libre-remote-rc5.4
          (cd libre-remote-rc5.3 && gradle --no-daemon --stacktrace :composeApp:assembleDebug)
          (cd libre-remote-rc5.4 && gradle --no-daemon --stacktrace :composeApp:assembleDebug)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            mkdir -p upgrade-qa
            OLD="$(find libre-remote-rc5.3/composeApp/build/outputs/apk/debug -name '*.apk' -type f | head -1)"
            NEW="$(find libre-remote-rc5.4/composeApp/build/outputs/apk/debug -name '*.apk' -type f | head -1)"
            test -n "$OLD" && test -n "$NEW"
            adb install "$OLD" | tee upgrade-qa/install-old.txt
            adb shell dumpsys package "$APP_ID" > upgrade-qa/before.txt
            adb shell am start -W -n "$APP_ID/$APP_ACTIVITY" > upgrade-qa/launch-old.txt
            adb shell am force-stop "$APP_ID"
            adb install -r "$NEW" | tee upgrade-qa/install-upgrade.txt
            adb shell dumpsys package "$APP_ID" > upgrade-qa/after.txt
            grep -q 'versionName=2.1.3-rc5.4-customization' upgrade-qa/after.txt
            adb shell am start -W -n "$APP_ID/$APP_ACTIVITY" > upgrade-qa/launch-new.txt
            sleep 2
            test -n "$(adb shell pidof "$APP_ID" | tr -d '\r')"
            adb exec-out uiautomator dump /dev/tty > upgrade-qa/ui-after-upgrade.xml
            adb exec-out screencap -p > upgrade-qa/ui-after-upgrade.png
            adb logcat -d > upgrade-qa/logcat.txt
            ! grep -E 'FATAL EXCEPTION|AndroidRuntime.*FATAL|ANR in .*libreremote' upgrade-qa/logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Libre-Remote-RC5.3-to-RC5.4-upgrade-QA
          path: upgrade-qa/**
          retention-days: 14
