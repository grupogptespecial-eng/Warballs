name: Libre Remote Production Signing

on:
  workflow_dispatch:
    inputs:
      enforce_credentials:
        description: Fail instead of reporting BLOCKED when signing credentials are missing
        required: true
        default: false
        type: boolean
  push:
    branches:
      - fix/libre-remote-rc5.4-hardening
      - release/libre-remote-2.1.3-rc5.4-android-tested
    paths:
      - '.github/workflows/libre-remote-release-signing.yml'

permissions:
  contents: read

env:
  LIBRE_REMOTE_STRICT_SECURE_STORE: '0'
  LIBRE_REMOTE_TEST_SECURE_STORE: '1'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      KS_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
      KS_PASS: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      KEY_PASS: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        name: Check Android signing credentials
        run: |
          ready=true
          for v in KS_B64 KS_PASS KEY_ALIAS KEY_PASS; do [ -n "${!v}" ] || ready=false; done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" != true ]; then
            echo 'BLOCKED: Android release signing secrets are not configured.' | tee android-signing-status.txt
            if [ '${{ inputs.enforce_credentials }}' = true ]; then exit 1; fi
          fi
      - name: Materialize hardened source
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          bash .rc5-universal/materialize-rc5.4.sh libre-remote-universal
          python3 scripts/harden_libre_remote_rc5_4.py libre-remote-universal
          python3 scripts/implement_libre_remote_runtime_hardening.py libre-remote-universal
          python3 scripts/finalize_libre_remote_runtime_hardening.py libre-remote-universal
          python3 scripts/enable_libre_remote_test_secure_store.py libre-remote-universal
          python3 scripts/audit_libre_remote_runtime_hardening.py libre-remote-universal --strict --report android-release-audit.json
      - uses: actions/setup-java@v5
        if: steps.gate.outputs.ready == 'true'
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        if: steps.gate.outputs.ready == 'true'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.gate.outputs.ready == 'true'
        with: {gradle-version: '8.13'}
      - name: Build and sign Android release artifacts
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cd libre-remote-universal
          gradle --no-daemon :composeApp:tasks --all > ../android-release-tasks.txt
          grep -q 'assembleRelease' ../android-release-tasks.txt
          gradle --no-daemon --stacktrace :composeApp:assembleRelease
          if grep -q 'bundleRelease' ../android-release-tasks.txt; then gradle --no-daemon --stacktrace :composeApp:bundleRelease; fi
          cd ..
          mkdir -p signed/android
          APK="$(find libre-remote-universal/composeApp/build/outputs/apk/release -name '*.apk' -type f | head -1)"
          test -n "$APK"
          cp "$APK" signed/android/Libre-Remote-2.1.3.apk
          apksigner sign --ks "$RUNNER_TEMP/release.jks" --ks-pass "pass:$KS_PASS" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" signed/android/Libre-Remote-2.1.3.apk
          apksigner verify --verbose --print-certs signed/android/Libre-Remote-2.1.3.apk | tee signed/android/apk-signature.txt
          AAB="$(find libre-remote-universal/composeApp/build/outputs/bundle -name '*.aab' -type f 2>/dev/null | head -1 || true)"
          if [ -n "$AAB" ]; then
            cp "$AAB" signed/android/Libre-Remote-2.1.3.aab
            jarsigner -keystore "$RUNNER_TEMP/release.jks" -storepass "$KS_PASS" -keypass "$KEY_PASS" signed/android/Libre-Remote-2.1.3.aab "$KEY_ALIAS"
            jarsigner -verify -verbose -certs signed/android/Libre-Remote-2.1.3.aab > signed/android/aab-signature.txt
          fi
          sha256sum signed/android/Libre-Remote-* > signed/android/SHA256SUMS.txt
          echo 'PASS: Android release artifacts signed and verified.' > android-signing-status.txt
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Libre-Remote-Android-Production-Signing
          path: |
            android-signing-status.txt
            android-release-audit.json
            signed/android/**
          retention-days: 14

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PFX_B64: ${{ secrets.WINDOWS_SIGNING_PFX_B64 }}
      PFX_PASS: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        shell: pwsh
        run: |
          $ready = (-not [string]::IsNullOrWhiteSpace($env:PFX_B64)) -and (-not [string]::IsNullOrWhiteSpace($env:PFX_PASS))
          "ready=$($ready.ToString().ToLower())" | Out-File -Append $env:GITHUB_OUTPUT
          if (-not $ready) {
            'BLOCKED: Windows Authenticode secrets are not configured.' | Set-Content windows-signing-status.txt
            if ('${{ inputs.enforce_credentials }}' -eq 'true') { throw 'Windows signing credentials missing' }
          }
      - name: Materialize hardened source
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash .rc5-universal/materialize-rc5.4.sh libre-remote-universal
          python scripts/harden_libre_remote_rc5_4.py libre-remote-universal
          python scripts/implement_libre_remote_runtime_hardening.py libre-remote-universal
          python scripts/finalize_libre_remote_runtime_hardening.py libre-remote-universal
          python scripts/enable_libre_remote_test_secure_store.py libre-remote-universal
          python scripts/audit_libre_remote_runtime_hardening.py libre-remote-universal --strict --report windows-release-audit.json
      - uses: actions/setup-java@v5
        if: steps.gate.outputs.ready == 'true'
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        if: steps.gate.outputs.ready == 'true'
        with: {gradle-version: '8.13'}
      - name: Build and Authenticode-sign installers
        if: steps.gate.outputs.ready == 'true'
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\release.pfx", [Convert]::FromBase64String($env:PFX_B64))
          Push-Location libre-remote-universal
          gradle --no-daemon --stacktrace :composeApp:packageMsi :composeApp:packageExe
          Pop-Location
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $signtool) { throw 'signtool.exe not found' }
          New-Item -ItemType Directory -Force signed/windows | Out-Null
          $packages = @(
            Get-ChildItem libre-remote-universal/composeApp/build/compose/binaries/main/msi -Filter *.msi -Recurse
            Get-ChildItem libre-remote-universal/composeApp/build/compose/binaries/main/exe -Filter *.exe -Recurse
          )
          if ($packages.Count -lt 2) { throw 'MSI and EXE are both required' }
          foreach ($pkg in $packages) {
            $dest = Join-Path signed/windows $pkg.Name
            Copy-Item $pkg.FullName $dest
            & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f "$env:RUNNER_TEMP\release.pfx" /p $env:PFX_PASS $dest
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed for $dest" }
            & $signtool verify /pa /v $dest | Out-File -Append signed/windows/signature-verification.txt
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed for $dest" }
          }
          Get-ChildItem signed/windows -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path)" } | Set-Content signed/windows/SHA256SUMS.txt
          'PASS: Windows installers Authenticode-signed and verified.' | Set-Content windows-signing-status.txt
          Remove-Item "$env:RUNNER_TEMP\release.pfx" -Force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Libre-Remote-Windows-Production-Signing
          path: |
            windows-signing-status.txt
            windows-release-audit.json
            signed/windows/**
          retention-days: 14

  macos:
    runs-on: macos-15
    timeout-minutes: 75
    env:
      P12_B64: ${{ secrets.MACOS_DEVELOPER_ID_P12_B64 }}
      P12_PASS: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
      NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
      NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        run: |
          ready=true
          for v in P12_B64 P12_PASS NOTARY_APPLE_ID NOTARY_TEAM_ID NOTARY_PASSWORD; do [ -n "${!v}" ] || ready=false; done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" != true ]; then
            echo 'BLOCKED: Developer ID/notarization secrets are not configured.' | tee macos-signing-status.txt
            if [ '${{ inputs.enforce_credentials }}' = true ]; then exit 1; fi
          fi
      - name: Materialize hardened source
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          bash .rc5-universal/materialize-rc5.4.sh libre-remote-universal
          python3 scripts/harden_libre_remote_rc5_4.py libre-remote-universal
          python3 scripts/implement_libre_remote_runtime_hardening.py libre-remote-universal
          python3 scripts/finalize_libre_remote_runtime_hardening.py libre-remote-universal
          python3 scripts/enable_libre_remote_test_secure_store.py libre-remote-universal
          python3 scripts/audit_libre_remote_runtime_hardening.py libre-remote-universal --strict --report macos-release-audit.json
      - uses: actions/setup-java@v5
        if: steps.gate.outputs.ready == 'true'
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        if: steps.gate.outputs.ready == 'true'
        with: {gradle-version: '8.13'}
      - name: Import Developer ID identity
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/libre-signing.keychain-db"
          echo "$P12_B64" | base64 -d > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p runner "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p runner "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASS" -T /usr/bin/codesign -T /usr/bin/productsign
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k runner "$KEYCHAIN"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)"
          INSTALLER_IDENTITY="$(security find-identity -v "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Installer:[^"]*\)".*/\1/p' | head -1)"
          test -n "$IDENTITY" && test -n "$INSTALLER_IDENTITY"
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "INSTALLER_IDENTITY=$INSTALLER_IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
      - name: Build, sign, notarize and staple macOS artifacts
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          (cd libre-remote-universal && gradle --no-daemon --stacktrace :composeApp:createDistributable)
          APP="$(find libre-remote-universal/composeApp/build/compose/binaries/main/app -name '*.app' -type d | head -1)"
          test -n "$APP"
          codesign --force --deep --options runtime --timestamp --keychain "$KEYCHAIN" --sign "$IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | tee macos-codesign-verification.txt
          mkdir -p signed/macos
          hdiutil create -volname 'Libre Remote' -srcfolder "$APP" -ov -format UDZO signed/macos/Libre-Remote-2.1.3.dmg
          codesign --force --timestamp --keychain "$KEYCHAIN" --sign "$IDENTITY" signed/macos/Libre-Remote-2.1.3.dmg
          pkgbuild --component "$APP" --install-location /Applications "$RUNNER_TEMP/Libre-Remote-unsigned.pkg"
          productsign --sign "$INSTALLER_IDENTITY" --keychain "$KEYCHAIN" "$RUNNER_TEMP/Libre-Remote-unsigned.pkg" signed/macos/Libre-Remote-2.1.3.pkg
          pkgutil --check-signature signed/macos/Libre-Remote-2.1.3.pkg | tee signed/macos/pkg-signature.txt
          for artifact in signed/macos/Libre-Remote-2.1.3.dmg signed/macos/Libre-Remote-2.1.3.pkg; do
            xcrun notarytool submit "$artifact" --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --wait | tee -a signed/macos/notarization.txt
            xcrun stapler staple "$artifact"
            xcrun stapler validate "$artifact"
          done
          spctl -a -vv -t open --context context:primary-signature "$APP" 2>&1 | tee signed/macos/gatekeeper.txt
          shasum -a 256 signed/macos/Libre-Remote-* > signed/macos/SHA256SUMS.txt
          echo 'PASS: macOS artifacts signed, notarized and stapled.' > macos-signing-status.txt
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/Libre-Remote-unsigned.pkg"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Libre-Remote-macOS-Production-Signing
          path: |
            macos-signing-status.txt
            macos-release-audit.json
            macos-codesign-verification.txt
            signed/macos/**
          retention-days: 14

  ios-testflight:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      IOS_P12_B64: ${{ secrets.IOS_DISTRIBUTION_P12_B64 }}
      IOS_P12_PASS: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
      PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_B64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_KEY_B64: ${{ secrets.ASC_API_PRIVATE_KEY_B64 }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        run: |
          ready=true
          for v in IOS_P12_B64 IOS_P12_PASS PROFILE_B64 APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_B64; do [ -n "${!v}" ] || ready=false; done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" != true ]; then
            echo 'BLOCKED: iOS distribution/profile/App Store Connect secrets are not configured.' | tee ios-testflight-status.txt
            if [ '${{ inputs.enforce_credentials }}' = true ]; then exit 1; fi
          fi
      - name: Materialize hardened source and XCFramework
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          bash .rc5-universal/materialize-rc5.4.sh libre-remote-universal
          python3 scripts/harden_libre_remote_rc5_4.py libre-remote-universal
          python3 scripts/implement_libre_remote_runtime_hardening.py libre-remote-universal
          python3 scripts/finalize_libre_remote_runtime_hardening.py libre-remote-universal
          python3 scripts/enable_libre_remote_test_secure_store.py libre-remote-universal
          python3 scripts/audit_libre_remote_runtime_hardening.py libre-remote-universal --strict --report ios-release-audit.json
      - uses: actions/setup-java@v5
        if: steps.gate.outputs.ready == 'true'
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        if: steps.gate.outputs.ready == 'true'
        with: {gradle-version: '8.13'}
      - name: Build XCFramework
        if: steps.gate.outputs.ready == 'true'
        working-directory: libre-remote-universal
        run: |
          gradle --no-daemon --stacktrace :composeApp:linkReleaseFrameworkIosArm64 :composeApp:linkReleaseFrameworkIosSimulatorArm64
          rm -rf composeApp/build/XCFrameworks/LibreRemote.xcframework
          mkdir -p composeApp/build/XCFrameworks
          xcodebuild -create-xcframework \
            -framework composeApp/build/bin/iosArm64/releaseFramework/LibreRemote.framework \
            -framework composeApp/build/bin/iosSimulatorArm64/releaseFramework/LibreRemote.framework \
            -output composeApp/build/XCFrameworks/LibreRemote.xcframework
      - name: Import Apple Distribution certificate and provisioning profile
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/ios-signing.keychain-db"
          echo "$IOS_P12_B64" | base64 -d > "$RUNNER_TEMP/ios-distribution.p12"
          echo "$PROFILE_B64" | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p runner "$KEYCHAIN"
          security unlock-keychain -p runner "$KEYCHAIN"
          security import "$RUNNER_TEMP/ios-distribution.p12" -k "$KEYCHAIN" -P "$IOS_P12_PASS" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k runner "$KEYCHAIN"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID="$(plutil -extract UUID raw -o - "$RUNNER_TEMP/profile.plist")"
          PROFILE_NAME="$(plutil -extract Name raw -o - "$RUNNER_TEMP/profile.plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "$ASC_KEY_B64" | base64 -d > "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          echo "IOS_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
      - name: Archive and upload to App Store Connect/TestFlight
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          cd libre-remote-universal/iosApp
          xcodegen generate
          xcodebuild -project LibreRemoteIOS.xcodeproj -scheme LibreRemoteIOS -sdk iphoneos \
            -configuration Release -archivePath "$RUNNER_TEMP/LibreRemote.xcarchive" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" CODE_SIGN_IDENTITY='Apple Distribution' archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key><dict>
              <key>io.github.grupogptespecialeng.libreremote</key><string>$PROFILE_NAME</string>
            </dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/LibreRemote.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tee ../../testflight-upload.txt
          echo 'PASS: archive exported/uploaded to App Store Connect for TestFlight processing.' > ../../ios-testflight-status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Libre-Remote-iOS-TestFlight-Distribution
          path: |
            ios-testflight-status.txt
            ios-release-audit.json
            testflight-upload.txt
          retention-days: 14
