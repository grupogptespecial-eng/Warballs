name: Build Libre Remote v0.2

on:
  push:
    branches:
      - build/libre-remote-v02
    paths:
      - "lg-wifi-remote-app/**"
      - ".github/workflows/build-lg-wifi-remote.yml"
  pull_request:
    paths:
      - "lg-wifi-remote-app/**"
      - ".github/workflows/build-lg-wifi-remote.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Normalize source before compilation
        working-directory: lg-wifi-remote-app
        run: |
          sed -i '/automirrored.rounded.ArrowBack/d' app/src/main/java/com/geronimo/controlelgwifi/MainActivity.kt
          sed -i 's/Icons.AutoMirrored.Rounded.ArrowBack/Icons.Rounded.ArrowBack/g' app/src/main/java/com/geronimo/controlelgwifi/MainActivity.kt
          sed -i 's/@Composable Column\.() -> Unit/@Composable androidx.compose.foundation.layout.ColumnScope.() -> Unit/' app/src/main/java/com/geronimo/controlelgwifi/MainActivity.kt

      - name: Build APK
        id: build
        continue-on-error: true
        working-directory: lg-wifi-remote-app
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-build-log
          path: lg-wifi-remote-app/build.log
          retention-days: 7

      - name: Prepare distributables
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p output/source
          cp lg-wifi-remote-app/app/build/outputs/apk/debug/app-debug.apk output/Libre-Remote-v0.2.apk
          sha256sum output/Libre-Remote-v0.2.apk > output/Libre-Remote-v0.2.sha256
          rsync -a --exclude build --exclude .gradle lg-wifi-remote-app/ output/source/
          cd output
          zip -qr Libre-Remote-v0.2-source.zip source
          rm -rf source

      - name: Upload APK and source
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-v0.2
          path: output/*
          if-no-files-found: error
          retention-days: 30

      - name: Fail when compilation failed
        if: steps.build.outcome == 'failure'
        run: exit 1
