name: Build Libre Remote 1.0 RC

on:
  push:
    branches:
      - build/libre-remote-v1-rc1
    paths:
      - "lg-wifi-remote-app/**"
      - ".github/workflows/build-lg-wifi-remote.yml"
  pull_request:
    paths:
      - "lg-wifi-remote-app/**"
      - ".github/workflows/build-lg-wifi-remote.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Generate private Play upload key
        shell: bash
        run: |
          set -euo pipefail
          PASSWORD="$(openssl rand -hex 18)"
          ALIAS="libre-remote-upload"
          echo "::add-mask::$PASSWORD"
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/libre-remote-upload-key.jks" \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=Libre Remote Upload, OU=Open Source, O=Libre Remote Community, L=Rio de Janeiro, ST=RJ, C=BR"
          echo "LIBRE_KEYSTORE_PATH=$GITHUB_WORKSPACE/libre-remote-upload-key.jks" >> "$GITHUB_ENV"
          echo "LIBRE_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "LIBRE_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "LIBRE_KEY_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/private-key"
          cat > "$GITHUB_WORKSPACE/private-key/LEIA-ME.txt" <<EOF
          LIBRE REMOTE - CHAVE PRIVADA DE UPLOAD DO GOOGLE PLAY

          Arquivo: libre-remote-upload-key.jks
          Alias: $ALIAS
          Senha do keystore: $PASSWORD
          Senha da chave: $PASSWORD

          Guarde este pacote em local seguro e fora do repositório público.
          Esta é uma chave de UPLOAD, não a chave final de assinatura gerenciada pelo Play App Signing.
          EOF
          cp "$GITHUB_WORKSPACE/libre-remote-upload-key.jks" "$GITHUB_WORKSPACE/private-key/"

      - name: Unit tests, lint and release build
        id: build
        continue-on-error: true
        working-directory: lg-wifi-remote-app
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:lintRelease \
            :app:assembleRelease \
            :app:bundleRelease 2>&1 | tee build.log

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-1.0-RC-build-log
          path: |
            lg-wifi-remote-app/build.log
            lg-wifi-remote-app/app/build/reports/lint-results-release.html
            lg-wifi-remote-app/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify and package release
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/source output/store
          APK="lg-wifi-remote-app/app/build/outputs/apk/release/app-release.apk"
          AAB="lg-wifi-remote-app/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          cp "$APK" output/Libre-Remote-1.0.0-rc1.apk
          cp "$AAB" output/Libre-Remote-1.0.0-rc1.aab
          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs output/Libre-Remote-1.0.0-rc1.apk > output/APK-SIGNATURE.txt
          sha256sum output/Libre-Remote-1.0.0-rc1.apk output/Libre-Remote-1.0.0-rc1.aab > output/SHA256SUMS.txt
          rsync -a --exclude build --exclude .gradle --exclude local.properties lg-wifi-remote-app/ output/source/
          (cd output && zip -qr Libre-Remote-1.0.0-rc1-source.zip source && rm -rf source)
          (cd private-key && zip -qr ../output/PRIVATE-Libre-Remote-upload-key.zip .)
          if [ -d "lg-wifi-remote-app/store-listing" ]; then
            cp -r lg-wifi-remote-app/store-listing/* output/store/
            (cd output && zip -qr Libre-Remote-Play-Store-listing.zip store && rm -rf store)
          fi
          ls -lh output

      - name: Upload release candidate
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-1.0.0-RC1
          path: output/*
          if-no-files-found: error
          retention-days: 30

      - name: Fail when validation failed
        if: steps.build.outcome == 'failure'
        run: exit 1
