name: Build LG Wi-Fi Remote APK

on:
  push:
    branches:
      - build/lg-wifi-remote
    paths:
      - "lg-wifi-remote-app/**"
      - ".github/workflows/build-lg-wifi-remote.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build installable APK
        working-directory: lg-wifi-remote-app
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output
          cp lg-wifi-remote-app/app/build/outputs/apk/debug/app-debug.apk output/Controle-LG-WiFi.apk
          sha256sum output/Controle-LG-WiFi.apk > output/Controle-LG-WiFi.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Controle-LG-WiFi-APK
          path: output/*
          if-no-files-found: error
          retention-days: 30
