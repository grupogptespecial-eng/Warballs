name: Libre Remote 2 Final Validation v2

on:
  push:
    branches: [feature/libre-remote-2-product-foundation]
    paths: [".github/workflows/final-validation-v2.yml"]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: libre-remote-2-final-validation-v2
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout product branch
        uses: actions/checkout@v4
        with:
          ref: feature/libre-remote-2-product-foundation
          fetch-depth: 0

      - name: Materialize reviewed source
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_id=8269145198
          curl --fail-with-body -sSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" \
            -o "$RUNNER_TEMP/verified-source.zip"

          mkdir -p "$RUNNER_TEMP/verified-source"
          unzip -q "$RUNNER_TEMP/verified-source.zip" -d "$RUNNER_TEMP/verified-source"
          archive="$RUNNER_TEMP/verified-source/reconstructed.tar.gz"
          test -s "$archive"

          python3 - "$archive" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          data = bytearray(path.read_bytes())
          fixes = ((63805, 0o367, 0o365), (63806, 0o66, 0o166))
          for offset, old, new in fixes:
              if data[offset] != old:
                  raise SystemExit(f"Unexpected reviewed archive byte at {offset}: {data[offset]:#o}")
              data[offset] = new
          path.write_bytes(data)
          PY

          echo "5f537a05fd3f6615edda498563210d51e7549ad81849a7fd48039f63c3facfe4  $archive" | sha256sum -c -
          tar -tzf "$archive" | tee "$RUNNER_TEMP/source-files.txt"

          rm -rf lg-wifi-remote-app
          mkdir -p lg-wifi-remote-app
          tar -xzf "$archive" -C lg-wifi-remote-app

          rm -rf lg-wifi-remote-app/app/schemas
          mkdir -p lg-wifi-remote-app/app/schemas
          touch lg-wifi-remote-app/app/schemas/.gitkeep

          test -f lg-wifi-remote-app/app/src/main/java/com/geronimo/controlelgwifi/ProductDatabase.kt
          test -f lg-wifi-remote-app/app/src/main/java/com/geronimo/controlelgwifi/CommandScheduler.kt
          test -f lg-wifi-remote-app/app/src/main/java/com/geronimo/controlelgwifi/MacroEngine.kt
          test -f lg-wifi-remote-app/app/src/main/java/com/geronimo/controlelgwifi/RemoteViewModel.kt
          test -f lg-wifi-remote-app/ARCHITECTURE.md
          test -f lg-wifi-remote-app/store-listing/FINAL-SUBMISSION-CHECKLIST.md

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Generate Gradle wrapper
        working-directory: lg-wifi-remote-app
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 8.10.2 --distribution-type bin
          chmod +x gradlew
          ./gradlew --version

      - name: Configure temporary validation signing
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 18)"
          alias="libre-remote-final-validation"
          echo "::add-mask::$password"
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/validation.jks" \
            -storepass "$password" -keypass "$password" -alias "$alias" \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=Libre Remote Final Validation, OU=Open Source, O=Libre Remote Community, L=Rio de Janeiro, ST=RJ, C=BR"
          echo "LIBRE_KEYSTORE_PATH=$RUNNER_TEMP/validation.jks" >> "$GITHUB_ENV"
          echo "LIBRE_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "LIBRE_KEY_ALIAS=$alias" >> "$GITHUB_ENV"
          echo "LIBRE_KEY_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Unit tests, release lint, APK and AAB
        working-directory: lg-wifi-remote-app
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:lintRelease \
            :app:assembleRelease \
            :app:bundleRelease 2>&1 | tee build-final.log

      - name: Verify and package candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-output/source final-output/store
          APK="lg-wifi-remote-app/app/build/outputs/apk/release/app-release.apk"
          AAB="lg-wifi-remote-app/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"

          cp "$APK" final-output/Libre-Remote-2.0.0-final-validation.apk
          cp "$AAB" final-output/Libre-Remote-2.0.0-final-validation.aab

          signer="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$signer"
          "$signer" verify --verbose --print-certs "$APK" > final-output/APK-SIGNATURE.txt
          sha256sum final-output/*.apk final-output/*.aab > final-output/SHA256SUMS.txt

          rsync -a \
            --exclude build --exclude .gradle --exclude .kotlin --exclude local.properties \
            lg-wifi-remote-app/ final-output/source/
          (cd final-output && zip -qr Libre-Remote-2.0.0-source.zip source && rm -rf source)

          cp -r lg-wifi-remote-app/store-listing/. final-output/store/
          printf 'Visual assets are added to the public handoff package after CI validation.\n' > final-output/store/GRAPHICS-NOTE.txt
          (cd final-output && zip -qr Libre-Remote-2.0.0-play-store-materials.zip store && rm -rf store)

          cp lg-wifi-remote-app/build-final.log final-output/BUILD-LOG.txt
          cp lg-wifi-remote-app/app/build/reports/lint-results-release.html final-output/LINT-REPORT.html
          printf 'This CI candidate uses a temporary validation key. Production must use the permanent Play upload key.\n' > final-output/IMPORTANT-SIGNING.txt

          {
            echo '# Libre Remote 2 final validation succeeded'
            echo
            echo "Workflow run: $GITHUB_RUN_ID"
            echo 'Validated: reviewed source hash, unit tests, release lint, APK, AAB and APK signature.'
            echo
            cat final-output/SHA256SUMS.txt
          } > lg-wifi-remote-app/CI_SUCCESS.md

      - name: Commit clean validated source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .final-b64 .final-materialize .final-overlay* .final-source* .final-suffix* .final2-overlay .final2-b32 .final-patch
          rm -f lg-wifi-remote-app/.*trigger* lg-wifi-remote-app/.universal-*
          git config user.name "Libre Remote CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Materialize and validate Libre Remote 2.0 final source [skip ci]"
            git push origin HEAD:feature/libre-remote-2-product-foundation
          fi

      - name: Upload final validation candidate
        uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-2.0.0-final-validation
          path: final-output/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-2.0.0-final-validation-reports
          path: |
            ${{ runner.temp }}/source-files.txt
            lg-wifi-remote-app/build-final.log
            lg-wifi-remote-app/app/build/reports/**
          if-no-files-found: warn
          retention-days: 14
