name: Libre Remote Runtime Security and Protocol Lab

on:
  workflow_dispatch:
  pull_request:
    branches: [release/libre-remote-2.1.3-rc5.4-android-tested]
    paths:
      - 'scripts/implement_libre_remote_runtime_hardening.py'
      - 'scripts/finalize_libre_remote_runtime_hardening.py'
      - 'scripts/enable_libre_remote_test_secure_store.py'
      - 'scripts/audit_libre_remote_runtime_hardening.py'
      - 'protocol-lab/**'
      - '.github/workflows/libre-remote-runtime-security.yml'
      - '.rc5-universal/**'
      - 'libre-remote-universal/**'
      - 'specs/001-rc5-4-multiplatform-hardening/**'

permissions:
  contents: read

concurrency:
  group: libre-remote-runtime-security-${{ github.ref }}
  cancel-in-progress: true

env:
  LIBRE_REMOTE_STRICT_SECURE_STORE: '1'
  LIBRE_REMOTE_TEST_SECURE_STORE: '1'

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile implementation scripts
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/harden_libre_remote_rc5_4.py \
            scripts/implement_libre_remote_runtime_hardening.py \
            scripts/finalize_libre_remote_runtime_hardening.py \
            scripts/enable_libre_remote_test_secure_store.py \
            scripts/audit_libre_remote_runtime_hardening.py \
            protocol-lab/libre_remote_lab.py
      - name: Self-test deterministic protocol lab
        run: |
          set -euo pipefail
          python3 protocol-lab/libre_remote_lab.py --self-test --json | tee protocol-lab-self-test.json
      - name: Materialize, implement and strictly audit RC5.4
        run: |
          set -euo pipefail
          bash .rc5-universal/materialize-rc5.4.sh libre-remote-universal
          python3 scripts/harden_libre_remote_rc5_4.py libre-remote-universal
          python3 scripts/implement_libre_remote_runtime_hardening.py libre-remote-universal
          python3 scripts/finalize_libre_remote_runtime_hardening.py libre-remote-universal
          python3 scripts/enable_libre_remote_test_secure_store.py libre-remote-universal
          python3 scripts/audit_libre_remote_runtime_hardening.py libre-remote-universal --strict --report runtime-security-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Libre-Remote-Runtime-Security-Preflight
          path: |
            protocol-lab-self-test.json
            runtime-security-audit.json
            libre-remote-universal/RUNTIME-HARDENING.md
            libre-remote-universal/HARDENING.md
          retention-days: 14

  protocol-lab:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Ensure OpenSSL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command openssl -ErrorAction SilentlyContinue)) {
            choco install openssl -y --no-progress
          }
      - name: Show OpenSSL
        shell: bash
        run: openssl version
      - name: Run deterministic protocol fixtures
        shell: bash
        run: |
          set -euo pipefail
          python protocol-lab/libre_remote_lab.py --self-test --json | tee protocol-lab-${{ runner.os }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Libre-Remote-Protocol-Lab-${{ runner.os }}
          path: protocol-lab-${{ runner.os }}.json
          retention-days: 14

  desktop-contracts:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Materialize runtime-hardened RC5.4
        shell: bash
        run: |
          set -euo pipefail
          bash .rc5-universal/materialize-rc5.4.sh libre-remote-universal
          python scripts/harden_libre_remote_rc5_4.py libre-remote-universal
          python scripts/implement_libre_remote_runtime_hardening.py libre-remote-universal
          python scripts/finalize_libre_remote_runtime_hardening.py libre-remote-universal
          python scripts/enable_libre_remote_test_secure_store.py libre-remote-universal
          python scripts/audit_libre_remote_runtime_hardening.py libre-remote-universal --strict --report runtime-audit-${{ runner.os }}.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile and run common/desktop contracts
        working-directory: libre-remote-universal
        shell: bash
        run: gradle --no-daemon --stacktrace :composeApp:desktopTest :composeApp:createDistributable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Libre-Remote-Runtime-Contracts-${{ runner.os }}
          path: |
            runtime-audit-${{ runner.os }}.json
            libre-remote-universal/composeApp/build/reports/**
          retention-days: 14

  android-secure-store:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Materialize runtime-hardened RC5.4
        run: |
          set -euo pipefail
          bash .rc5-universal/materialize-rc5.4.sh libre-remote-universal
          python3 scripts/harden_libre_remote_rc5_4.py libre-remote-universal
          python3 scripts/implement_libre_remote_runtime_hardening.py libre-remote-universal
          python3 scripts/finalize_libre_remote_runtime_hardening.py libre-remote-universal
          python3 scripts/enable_libre_remote_test_secure_store.py libre-remote-universal
          python3 scripts/audit_libre_remote_runtime_hardening.py libre-remote-universal --strict --report android-runtime-security.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile Android Keystore implementation
        working-directory: libre-remote-universal
        run: gradle --no-daemon --stacktrace :composeApp:assembleDebug
      - name: Verify secure initializer is packaged
        run: |
          set -euo pipefail
          grep -R --line-number 'LibreRemoteInitProvider' libre-remote-universal/composeApp/src/androidMain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Libre-Remote-Android-SecureStore-Evidence
          path: |
            android-runtime-security.json
            libre-remote-universal/composeApp/build/outputs/apk/debug/*.apk
          retention-days: 14

  ios-keychain:
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Materialize runtime-hardened RC5.4
        run: |
          set -euo pipefail
          bash .rc5-universal/materialize-rc5.4.sh libre-remote-universal
          python3 scripts/harden_libre_remote_rc5_4.py libre-remote-universal
          python3 scripts/implement_libre_remote_runtime_hardening.py libre-remote-universal
          python3 scripts/finalize_libre_remote_runtime_hardening.py libre-remote-universal
          python3 scripts/enable_libre_remote_test_secure_store.py libre-remote-universal
          python3 scripts/audit_libre_remote_runtime_hardening.py libre-remote-universal --strict --report ios-runtime-security.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile Apple Keychain actuals for simulator and device
        working-directory: libre-remote-universal
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            :composeApp:linkDebugFrameworkIosSimulatorArm64 \
            :composeApp:linkDebugFrameworkIosArm64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Libre-Remote-iOS-Keychain-Evidence
          path: |
            ios-runtime-security.json
            libre-remote-universal/composeApp/build/bin/iosSimulatorArm64/debugFramework/**
            libre-remote-universal/composeApp/build/bin/iosArm64/debugFramework/**
          retention-days: 14
