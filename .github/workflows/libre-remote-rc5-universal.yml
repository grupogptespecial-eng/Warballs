name: Libre Remote RC5.3 Manual Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Platform to build
        required: true
        default: android
        type: choice
        options: [android, windows, linux, macos, ios, all]

permissions:
  contents: read

concurrency:
  group: libre-remote-rc5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Materialize and verify exact RC5.3
        shell: bash
        run: bash .rc5-universal/materialize-rc5.3.sh

  android:
    if: ${{ inputs.target == 'android' || inputs.target == 'all' }}
    needs: source-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: bash .rc5-universal/materialize-rc5.3.sh
        shell: bash
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Test and build Android
        working-directory: libre-remote-universal
        run: gradle --no-daemon --stacktrace :composeApp:desktopTest :composeApp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-RC5.3-Android
          path: libre-remote-universal/composeApp/build/outputs/apk/debug/*.apk
          retention-days: 2

  windows:
    if: ${{ inputs.target == 'windows' || inputs.target == 'all' }}
    needs: source-integrity
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: bash .rc5-universal/materialize-rc5.3.sh
        shell: bash
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Test and package Windows
        working-directory: libre-remote-universal
        run: gradle --no-daemon --stacktrace :composeApp:desktopTest :composeApp:createDistributable
      - uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-RC5.3-Windows
          path: libre-remote-universal/composeApp/build/compose/binaries/main/app/**
          retention-days: 2

  linux:
    if: ${{ inputs.target == 'linux' || inputs.target == 'all' }}
    needs: source-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: bash .rc5-universal/materialize-rc5.3.sh
        shell: bash
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Test and package Linux
        working-directory: libre-remote-universal
        run: gradle --no-daemon --stacktrace :composeApp:desktopTest :composeApp:createDistributable
      - uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-RC5.3-Linux
          path: libre-remote-universal/composeApp/build/compose/binaries/main/app/**
          retention-days: 2

  macos:
    if: ${{ inputs.target == 'macos' || inputs.target == 'all' }}
    needs: source-integrity
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: bash .rc5-universal/materialize-rc5.3.sh
        shell: bash
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Test and package macOS
        working-directory: libre-remote-universal
        run: gradle --no-daemon --stacktrace :composeApp:desktopTest :composeApp:createDistributable
      - uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-RC5.3-macOS
          path: libre-remote-universal/composeApp/build/compose/binaries/main/app/**
          retention-days: 2

  ios:
    if: ${{ inputs.target == 'ios' || inputs.target == 'all' }}
    needs: source-integrity
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - run: bash .rc5-universal/materialize-rc5.3.sh
        shell: bash
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Compile iPhone frameworks
        working-directory: libre-remote-universal
        run: gradle --no-daemon --stacktrace :composeApp:linkDebugFrameworkIosSimulatorArm64 :composeApp:linkDebugFrameworkIosArm64
      - name: Build XCFramework
        shell: bash
        run: |
          set -euo pipefail
          cd libre-remote-universal
          rm -rf composeApp/build/XCFrameworks/LibreRemote.xcframework
          mkdir -p composeApp/build/XCFrameworks
          xcodebuild -create-xcframework \
            -framework composeApp/build/bin/iosSimulatorArm64/debugFramework/LibreRemote.framework \
            -framework composeApp/build/bin/iosArm64/debugFramework/LibreRemote.framework \
            -output composeApp/build/XCFrameworks/LibreRemote.xcframework
      - uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-RC5.3-iOS-XCFramework
          path: libre-remote-universal/composeApp/build/XCFrameworks/LibreRemote.xcframework/**
          retention-days: 2
