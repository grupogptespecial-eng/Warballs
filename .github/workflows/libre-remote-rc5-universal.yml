name: Libre Remote RC5.2 Manual Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Platform to build
        required: true
        default: android
        type: choice
        options:
          - android
          - windows
          - linux
          - macos
          - ios
          - all

permissions:
  contents: read

concurrency:
  group: libre-remote-rc5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify and materialize RC5.2 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf libre-remote-universal && mkdir libre-remote-universal
          cat .rc5-universal/part-*.b64 | base64 -d > rc5.tar.gz
          echo 'b16e7abf44e1445a901b7441850b8cfb321c65770b82a1981cbe06e0f75d0622  rc5.tar.gz' | sha256sum -c -
          tar -xzf rc5.tar.gz -C libre-remote-universal
          (cd libre-remote-universal && patch --batch -p1 < ../.rc5-universal/fix-01.patch)
          cat .rc5-universal/fix-03.part-*.b64 | base64 -d > fix03.patch.gz
          echo '796c41e0aa2a01935c6cad253d6618c2aa59493367d4ff534e321b0e8dcf0130  fix03.patch.gz' | sha256sum -c -
          gzip -dc fix03.patch.gz > fix03.patch
          echo '25c396feb217a1870d0bfec3db60c829739177bb53430180e6ea06392c37051c  fix03.patch' | sha256sum -c -
          (cd libre-remote-universal && patch --batch -p1 < ../fix03.patch)
          (cd libre-remote-universal && patch --batch -p1 < ../.rc5-universal/fix-04-ios-wrapper.patch)
          (cd libre-remote-universal && patch --batch -p1 < ../.rc5-universal/fix-05-ios-symbol.patch)
          (cd libre-remote-universal && patch --batch -p1 < ../.rc5-universal/fix-06-rc5.2-input-visual.patch)
          test -f libre-remote-universal/composeApp/src/commonMain/kotlin/io/github/grupogptespecialeng/libreremote/RemoteCommandPlan.kt
          grep -q 'versionName = "2.1.1-rc5.2-input-visual"' libre-remote-universal/composeApp/build.gradle.kts

  android:
    if: ${{ inputs.target == 'android' || inputs.target == 'all' }}
    needs: source-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Materialize RC5.2
        shell: bash
        run: |
          set -euo pipefail
          rm -rf libre-remote-universal && mkdir libre-remote-universal
          cat .rc5-universal/part-*.b64 | base64 -d > rc5.tar.gz
          tar -xzf rc5.tar.gz -C libre-remote-universal
          (cd libre-remote-universal && patch --batch -p1 < ../.rc5-universal/fix-01.patch)
          cat .rc5-universal/fix-03.part-*.b64 | base64 -d > fix03.patch.gz
          gzip -dc fix03.patch.gz > fix03.patch
          (cd libre-remote-universal && patch --batch -p1 < ../fix03.patch)
          (cd libre-remote-universal && patch --batch -p1 < ../.rc5-universal/fix-04-ios-wrapper.patch)
          (cd libre-remote-universal && patch --batch -p1 < ../.rc5-universal/fix-05-ios-symbol.patch)
          (cd libre-remote-universal && patch --batch -p1 < ../.rc5-universal/fix-06-rc5.2-input-visual.patch)
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test and build Android
        working-directory: libre-remote-universal
        run: gradle --no-daemon --stacktrace :composeApp:desktopTest :composeApp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-RC5.2-Android
          path: libre-remote-universal/composeApp/build/outputs/apk/debug/*.apk
          retention-days: 2

  windows:
    if: ${{ inputs.target == 'windows' || inputs.target == 'all' }}
    needs: source-integrity
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Materialize RC5.2
        shell: bash
        run: |
          set -euo pipefail
          rm -rf libre-remote-universal && mkdir libre-remote-universal
          cat .rc5-universal/part-*.b64 | base64 -d > rc5.tar.gz
          tar -xzf rc5.tar.gz -C libre-remote-universal
          (cd libre-remote-universal && patch --batch -p1 < ../.rc5-universal/fix-01.patch)
          cat .rc5-universal/fix-03.part-*.b64 | base64 -d > fix03.patch.gz
          gzip -dc fix03.patch.gz > fix03.patch
          (cd libre-remote-universal && patch --batch -p1 < ../fix03.patch)
          (cd libre-remote-universal && patch --batch -p1 < ../.rc5-universal/fix-04-ios-wrapper.patch)
          (cd libre-remote-universal && patch --batch -p1 < ../.rc5-universal/fix-05-ios-symbol.patch)
          (cd libre-remote-universal && patch --batch -p1 < ../.rc5-universal/fix-06-rc5.2-input-visual.patch)
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test and package Windows
        working-directory: libre-remote-universal
        run: gradle --no-daemon --stacktrace :composeApp:desktopTest :composeApp:createDistributable
      - uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-RC5.2-Windows
          path: libre-remote-universal/composeApp/build/compose/binaries/main/app/**
          retention-days: 2

  linux:
    if: ${{ inputs.target == 'linux' || inputs.target == 'all' }}
    needs: source-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Materialize RC5.2
        shell: bash
        run: |
          set -euo pipefail
          rm -rf libre-remote-universal && mkdir libre-remote-universal
          cat .rc5-universal/part-*.b64 | base64 -d > rc5.tar.gz
          tar -xzf rc5.tar.gz -C libre-remote-universal
          (cd libre-remote-universal && patch --batch -p1 < ../.rc5-universal/fix-01.patch)
          cat .rc5-universal/fix-03.part-*.b64 | base64 -d > fix03.patch.gz
          gzip -dc fix03.patch.gz > fix03.patch
          (cd libre-remote-universal && patch --batch -p1 < ../fix03.patch)
          (cd libre-remote-universal && patch --batch -p1 < ../.rc5-universal/fix-04-ios-wrapper.patch)
          (cd libre-remote-universal && patch --batch -p1 < ../.rc5-universal/fix-05-ios-symbol.patch)
          (cd libre-remote-universal && patch --batch -p1 < ../.rc5-universal/fix-06-rc5.2-input-visual.patch)
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test and package Linux
        working-directory: libre-remote-universal
        run: gradle --no-daemon --stacktrace :composeApp:desktopTest :composeApp:createDistributable
      - uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-RC5.2-Linux
          path: libre-remote-universal/composeApp/build/compose/binaries/main/app/**
          retention-days: 2

  macos:
    if: ${{ inputs.target == 'macos' || inputs.target == 'all' }}
    needs: source-integrity
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Materialize RC5.2
        shell: bash
        run: |
          set -euo pipefail
          rm -rf libre-remote-universal && mkdir libre-remote-universal
          cat .rc5-universal/part-*.b64 | base64 -d > rc5.tar.gz
          tar -xzf rc5.tar.gz -C libre-remote-universal
          (cd libre-remote-universal && patch --batch -p1 < ../.rc5-universal/fix-01.patch)
          cat .rc5-universal/fix-03.part-*.b64 | base64 -d > fix03.patch.gz
          gzip -dc fix03.patch.gz > fix03.patch
          (cd libre-remote-universal && patch --batch -p1 < ../fix03.patch)
          (cd libre-remote-universal && patch --batch -p1 < ../.rc5-universal/fix-04-ios-wrapper.patch)
          (cd libre-remote-universal && patch --batch -p1 < ../.rc5-universal/fix-05-ios-symbol.patch)
          (cd libre-remote-universal && patch --batch -p1 < ../.rc5-universal/fix-06-rc5.2-input-visual.patch)
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test and package macOS
        working-directory: libre-remote-universal
        run: gradle --no-daemon --stacktrace :composeApp:desktopTest :composeApp:createDistributable
      - uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-RC5.2-macOS
          path: libre-remote-universal/composeApp/build/compose/binaries/main/app/**
          retention-days: 2

  ios:
    if: ${{ inputs.target == 'ios' || inputs.target == 'all' }}
    needs: source-integrity
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Materialize RC5.2
        shell: bash
        run: |
          set -euo pipefail
          rm -rf libre-remote-universal && mkdir libre-remote-universal
          cat .rc5-universal/part-*.b64 | base64 -d > rc5.tar.gz
          tar -xzf rc5.tar.gz -C libre-remote-universal
          (cd libre-remote-universal && patch --batch -p1 < ../.rc5-universal/fix-01.patch)
          cat .rc5-universal/fix-03.part-*.b64 | base64 -d > fix03.patch.gz
          gzip -dc fix03.patch.gz > fix03.patch
          (cd libre-remote-universal && patch --batch -p1 < ../fix03.patch)
          (cd libre-remote-universal && patch --batch -p1 < ../.rc5-universal/fix-04-ios-wrapper.patch)
          (cd libre-remote-universal && patch --batch -p1 < ../.rc5-universal/fix-05-ios-symbol.patch)
          (cd libre-remote-universal && patch --batch -p1 < ../.rc5-universal/fix-06-rc5.2-input-visual.patch)
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile iPhone frameworks
        working-directory: libre-remote-universal
        run: gradle --no-daemon --stacktrace :composeApp:linkDebugFrameworkIosSimulatorArm64 :composeApp:linkDebugFrameworkIosArm64
      - name: Build XCFramework
        shell: bash
        run: |
          set -euo pipefail
          cd libre-remote-universal
          rm -rf composeApp/build/XCFrameworks/LibreRemote.xcframework
          mkdir -p composeApp/build/XCFrameworks
          xcodebuild -create-xcframework \
            -framework composeApp/build/bin/iosSimulatorArm64/debugFramework/LibreRemote.framework \
            -framework composeApp/build/bin/iosArm64/debugFramework/LibreRemote.framework \
            -output composeApp/build/XCFrameworks/LibreRemote.xcframework
      - uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-RC5.2-iOS-XCFramework
          path: libre-remote-universal/composeApp/build/XCFrameworks/LibreRemote.xcframework/**
          retention-days: 2
