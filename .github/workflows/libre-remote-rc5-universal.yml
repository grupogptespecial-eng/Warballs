name: Libre Remote RC5 Universal

on:
  push:
    branches:
      - feature/libre-remote-rc5-universal
  workflow_dispatch:

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify source and RC5.1 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .rc5-universal/part-*.b64 | base64 -d > rc5.tar.gz
          echo 'b16e7abf44e1445a901b7441850b8cfb321c65770b82a1981cbe06e0f75d0622  rc5.tar.gz' | sha256sum -c -
          rm -rf rc5-check && mkdir rc5-check
          tar -xzf rc5.tar.gz -C rc5-check
          (cd rc5-check && patch --batch -p1 < ../.rc5-universal/fix-01.patch)

          cat .rc5-universal/fix-03.part-*.b64 | base64 -d > fix03.patch.gz
          echo '796c41e0aa2a01935c6cad253d6618c2aa59493367d4ff534e321b0e8dcf0130  fix03.patch.gz' | sha256sum -c -
          gzip -dc fix03.patch.gz > fix03.patch
          echo '25c396feb217a1870d0bfec3db60c829739177bb53430180e6ea06392c37051c  fix03.patch' | sha256sum -c -
          (cd rc5-check && patch --batch --dry-run -p1 < ../fix03.patch)

  android-common:
    needs: source-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Materialize RC5.1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf libre-remote-universal && mkdir libre-remote-universal
          cat .rc5-universal/part-*.b64 | base64 -d > rc5.tar.gz
          echo 'b16e7abf44e1445a901b7441850b8cfb321c65770b82a1981cbe06e0f75d0622  rc5.tar.gz' | sha256sum -c -
          tar -xzf rc5.tar.gz -C libre-remote-universal
          (cd libre-remote-universal && patch --batch -p1 < ../.rc5-universal/fix-01.patch)
          cat .rc5-universal/fix-03.part-*.b64 | base64 -d > fix03.patch.gz
          echo '796c41e0aa2a01935c6cad253d6618c2aa59493367d4ff534e321b0e8dcf0130  fix03.patch.gz' | sha256sum -c -
          gzip -dc fix03.patch.gz > fix03.patch
          echo '25c396feb217a1870d0bfec3db60c829739177bb53430180e6ea06392c37051c  fix03.patch' | sha256sum -c -
          (cd libre-remote-universal && patch --batch -p1 < ../fix03.patch)
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Regression tests and Android build
        working-directory: libre-remote-universal
        run: gradle --no-daemon --stacktrace :composeApp:desktopTest :composeApp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-RC5.1-Android
          path: libre-remote-universal/composeApp/build/outputs/apk/debug/*.apk

  desktop:
    needs: source-integrity
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: windows-latest
            name: Windows
          - os: macos-14
            name: macOS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Materialize RC5.1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf libre-remote-universal && mkdir libre-remote-universal
          cat .rc5-universal/part-*.b64 | base64 -d > rc5.tar.gz
          tar -xzf rc5.tar.gz -C libre-remote-universal
          (cd libre-remote-universal && patch --batch -p1 < ../.rc5-universal/fix-01.patch)
          cat .rc5-universal/fix-03.part-*.b64 | base64 -d > fix03.patch.gz
          gzip -dc fix03.patch.gz > fix03.patch
          echo '25c396feb217a1870d0bfec3db60c829739177bb53430180e6ea06392c37051c  fix03.patch' | sha256sum -c -
          (cd libre-remote-universal && patch --batch -p1 < ../fix03.patch)
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile and package desktop
        working-directory: libre-remote-universal
        run: gradle --no-daemon --stacktrace :composeApp:desktopTest :composeApp:createDistributable
      - uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-RC5.1-${{ matrix.name }}
          path: libre-remote-universal/composeApp/build/compose/binaries/main/app/**

  ios:
    needs: source-integrity
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Materialize RC5.1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf libre-remote-universal && mkdir libre-remote-universal
          cat .rc5-universal/part-*.b64 | base64 -d > rc5.tar.gz
          tar -xzf rc5.tar.gz -C libre-remote-universal
          (cd libre-remote-universal && patch --batch -p1 < ../.rc5-universal/fix-01.patch)
          cat .rc5-universal/fix-03.part-*.b64 | base64 -d > fix03.patch.gz
          gzip -dc fix03.patch.gz > fix03.patch
          echo '25c396feb217a1870d0bfec3db60c829739177bb53430180e6ea06392c37051c  fix03.patch' | shasum -a 256 -c -
          (cd libre-remote-universal && patch --batch -p1 < ../fix03.patch)
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Show Apple toolchain
        run: xcodebuild -version
      - name: Compile iPhone and simulator frameworks
        working-directory: libre-remote-universal
        run: gradle --no-daemon --stacktrace :composeApp:linkDebugFrameworkIosSimulatorArm64 :composeApp:linkDebugFrameworkIosArm64
      - name: Validate SwiftUI wrapper
        shell: bash
        run: |
          brew install xcodegen
          cd libre-remote-universal/iosApp
          xcodegen generate
          xcodebuild -project LibreRemoteIOS.xcodeproj -scheme LibreRemoteIOS -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-RC5.1-iOS-Frameworks
          path: |
            libre-remote-universal/composeApp/build/bin/iosSimulatorArm64/debugFramework/LibreRemote.framework/**
            libre-remote-universal/composeApp/build/bin/iosArm64/debugFramework/LibreRemote.framework/**
