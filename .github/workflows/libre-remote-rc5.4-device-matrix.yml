name: Libre Remote RC5.4 Device Matrix

on:
  workflow_dispatch:
  push:
    branches: [fix/libre-remote-rc5.4-hardening]

permissions:
  contents: read

env:
  APP_ID: io.github.grupogptespecialeng.libreremote
  APP_ACTIVITY: io.github.grupogptespecialeng.libreremote.MainActivity

jobs:
  device-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            profile: pixel_2
          - api: 33
            profile: pixel_4
          - api: 35
            profile: pixel_6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build hardened APK
        run: |
          set -euo pipefail
          bash .rc5-universal/materialize-rc5.4.sh libre-remote-universal
          python3 scripts/harden_libre_remote_rc5_4.py libre-remote-universal
          (cd libre-remote-universal && gradle --no-daemon --stacktrace :composeApp:assembleDebug)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            OUT="device-qa/${{ matrix.profile }}-api-${{ matrix.api }}"
            mkdir -p "$OUT"
            APK="$(find libre-remote-universal/composeApp/build/outputs/apk/debug -name '*.apk' -type f | head -1)"
            adb install -r "$APK"
            adb logcat -c
            adb shell am start -W -n "$APP_ID/$APP_ACTIVITY" | tee "$OUT/launch.txt"
            sleep 3
            test -n "$(adb shell pidof "$APP_ID" | tr -d '\r')"
            adb exec-out uiautomator dump /dev/tty > "$OUT/ui.xml"
            adb exec-out screencap -p > "$OUT/ui.png"
            adb logcat -d > "$OUT/logcat.txt"
            ! grep -E 'FATAL EXCEPTION|AndroidRuntime.*FATAL|ANR in .*libreremote' "$OUT/logcat.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Libre-Remote-device-${{ matrix.profile }}-api-${{ matrix.api }}
          path: device-qa/**
          retention-days: 14
