name: Materialize Libre Remote Final Source

on:
  push:
    branches:
      - feature/libre-remote-2-product-foundation
    paths:
      - ".github/workflows/materialize-libre-remote-final.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[materialized-final]')
    steps:
      - name: Replace branch tree with reviewed final source
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: feature/libre-remote-2-product-foundation
          PARENT_SHA: ${{ github.sha }}
          FINAL_TREE_SHA: ee675bcc8ad8d29fec545bf07759628ceced26f8
        shell: bash
        run: |
          set -euo pipefail
          payload=$(jq -n \
            --arg message "Materialize Libre Remote 2 final product source [materialized-final]" \
            --arg tree "$FINAL_TREE_SHA" \
            --arg parent "$PARENT_SHA" \
            '{message:$message, tree:$tree, parents:[$parent]}')
          response=$(curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/git/commits" \
            -d "$payload")
          commit_sha=$(jq -r '.sha' <<<"$response")
          test -n "$commit_sha"
          test "$commit_sha" != "null"
          curl --fail-with-body -sS -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/git/refs/heads/$BRANCH" \
            -d "$(jq -n --arg sha "$commit_sha" '{sha:$sha, force:false}')"
          echo "Materialized commit: $commit_sha"
