name: Validate and Stage Libre Remote 2

on:
  push:
    branches:
      - feature/libre-remote-2-product-foundation
    paths:
      - "lg-wifi-remote-app/**"
      - ".github/workflows/validate-and-stage-libre-remote.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-stage:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[ci-result]')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Configure temporary validation signing
        shell: bash
        run: |
          set -euo pipefail
          STORE_PASSWORD="$(openssl rand -hex 18)"
          KEY_PASSWORD="$STORE_PASSWORD"
          KEY_ALIAS="libre-remote-validation"
          echo "::add-mask::$STORE_PASSWORD"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/libre-validation.jks" \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=Libre Remote Validation, OU=Open Source, O=Libre Remote Community, L=Rio de Janeiro, ST=RJ, C=BR"
          echo "LIBRE_KEYSTORE_PATH=$RUNNER_TEMP/libre-validation.jks" >> "$GITHUB_ENV"
          echo "LIBRE_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "LIBRE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "LIBRE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build and validate
        id: build
        continue-on-error: true
        working-directory: lg-wifi-remote-app
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:lintRelease \
            :app:assembleRelease \
            :app:bundleRelease 2>&1 | tee build-stage.log

      - name: Package successful candidate
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm -f lg-wifi-remote-app/CI_FAILURE.txt
          mkdir -p staged/source staged/store
          APK=lg-wifi-remote-app/app/build/outputs/apk/release/app-release.apk
          AAB=lg-wifi-remote-app/app/build/outputs/bundle/release/app-release.aab
          cp "$APK" staged/Libre-Remote-2.0.0-rc1.apk
          cp "$AAB" staged/Libre-Remote-2.0.0-rc1.aab
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs staged/Libre-Remote-2.0.0-rc1.apk > staged/APK-SIGNATURE.txt
          sha256sum staged/Libre-Remote-2.0.0-rc1.apk staged/Libre-Remote-2.0.0-rc1.aab > staged/SHA256SUMS.txt
          rsync -a --exclude build --exclude .gradle --exclude .kotlin --exclude local.properties lg-wifi-remote-app/ staged/source/
          (cd staged && zip -qr Libre-Remote-2.0.0-rc1-source.zip source && rm -rf source)
          cp -r lg-wifi-remote-app/store-listing/* staged/store/
          (cd staged && zip -qr Libre-Remote-2.0.0-play-store.zip store && rm -rf store)
          cp lg-wifi-remote-app/build-stage.log staged/BUILD-LOG.txt
          {
            echo "# Libre Remote CI success"
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_ID"
            echo "Validated: unit tests, release lint, release APK, release AAB and APK signature."
            echo
            cat staged/SHA256SUMS.txt
            echo
            echo "The artifacts use a temporary CI validation key and are not the first-production Play signing artifacts."
          } > lg-wifi-remote-app/CI_SUCCESS.md

      - name: Record failure summary
        if: steps.build.outcome != 'success'
        shell: bash
        run: |
          rm -f lg-wifi-remote-app/CI_SUCCESS.md
          {
            echo "# Libre Remote CI failure"
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_ID"
            echo
            echo '```text'
            tail -n 240 lg-wifi-remote-app/build-stage.log || true
            echo '```'
          } > lg-wifi-remote-app/CI_FAILURE.txt

      - name: Commit CI result marker
        if: always()
        shell: bash
        run: |
          git config user.name "Libre Remote CI"
          git config user.email "actions@users.noreply.github.com"
          git add lg-wifi-remote-app/CI_SUCCESS.md lg-wifi-remote-app/CI_FAILURE.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Record Libre Remote validation result [ci-result]"
            git push origin HEAD:feature/libre-remote-2-product-foundation
          fi

      - name: Upload successful candidate
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-2.0.0-final-candidate
          path: staged/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-2.0.0-validation-reports
          path: |
            lg-wifi-remote-app/build-stage.log
            lg-wifi-remote-app/app/build/reports/**
          if-no-files-found: warn
          retention-days: 14

      - name: Fail workflow after preserving diagnostics
        if: steps.build.outcome != 'success'
        run: exit 1
