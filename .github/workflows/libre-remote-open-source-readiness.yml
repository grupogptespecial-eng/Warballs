name: Libre Remote Open Source Readiness

on:
  workflow_dispatch:
  pull_request:
    branches: [release/libre-remote-2.1.3-rc5.4-android-tested]
    paths:
      - 'README.md'
      - 'LICENSE'
      - 'NOTICE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'BUILDING.md'
      - 'CHANGELOG.md'
      - 'RELEASE_POLICY.md'
      - 'VERSIONING.md'
      - 'public-repo/**'
      - 'release/**'
      - 'scripts/audit_public_release.py'
      - 'scripts/audit_git_history.py'
      - 'scripts/audit_third_party_licenses.py'
      - 'scripts/export_libre_remote_public.py'
      - 'scripts/check_release_evidence.py'
      - 'scripts/convert_workflows_to_canonical_source.py'
      - '.github/workflows/libre-remote-open-source-readiness.yml'
      - 'libre-remote-universal/**'
      - '.rc5-universal/**'

permissions:
  contents: read

env:
  LIBRE_REMOTE_TEST_SECURE_STORE: '1'
  LIBRE_REMOTE_STRICT_SECURE_STORE: '0'

jobs:
  export-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Compile public-release tooling
        run: |
          python3 -m py_compile \
            scripts/audit_public_release.py \
            scripts/audit_git_history.py \
            scripts/audit_third_party_licenses.py \
            scripts/export_libre_remote_public.py \
            scripts/check_release_evidence.py \
            scripts/convert_workflows_to_canonical_source.py
      - name: Prepare canonical-equivalent RC5.4 source
        run: |
          set -euo pipefail
          if [ -f libre-remote-universal/settings.gradle.kts ] && [ -f libre-remote-universal/composeApp/build.gradle.kts ]; then
            echo 'Using committed canonical source'
          else
            rm -rf libre-remote-universal
            bash .rc5-universal/materialize-rc5.4.sh libre-remote-universal
            python3 scripts/harden_libre_remote_rc5_4.py libre-remote-universal
            python3 scripts/implement_libre_remote_runtime_hardening.py libre-remote-universal
            python3 scripts/finalize_libre_remote_runtime_hardening.py libre-remote-universal
            python3 scripts/enable_libre_remote_test_secure_store.py libre-remote-universal
            python3 scripts/audit_libre_remote_runtime_hardening.py libre-remote-universal --strict --report runtime-security-audit.json
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic
      - name: Resolve dependency inventory
        working-directory: libre-remote-universal
        run: gradle --no-daemon :composeApp:dependencies > ../gradle-dependencies.txt
      - name: Generate third-party review inventory
        run: |
          python3 scripts/audit_third_party_licenses.py \
            --dependencies gradle-dependencies.txt \
            --root libre-remote-universal \
            --output THIRD_PARTY_NOTICES.generated.md || true
      - name: Document why the current private Git history must not be published
        run: python3 scripts/audit_git_history.py --repo . --report private-history-audit.json || true
      - name: Export clean public repository snapshot
        run: |
          python3 scripts/export_libre_remote_public.py \
            --root . \
            --source libre-remote-universal \
            --output dist/Libre-Remote \
            --source-commit '${{ github.sha }}' \
            --allow-pending-third-party
      - name: Verify no legacy transport in export
        run: |
          set -euo pipefail
          if find dist/Libre-Remote \( -name '*.b64' -o -name '*.jks' -o -name '*.keystore' -o -name '*.p12' -o -name '*.pfx' \) -print | grep -q .; then
            echo 'Forbidden sensitive/transport file found in public export' >&2
            exit 1
          fi
          test ! -d dist/Libre-Remote/.rc5-universal
          test ! -d dist/Libre-Remote/.universal-payload
      - name: Archive source snapshot
        run: |
          cd dist
          zip -qr Libre-Remote-Public-Source.zip Libre-Remote
          sha256sum Libre-Remote-Public-Source.zip > Libre-Remote-Public-Source.zip.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Libre-Remote-Open-Source-Readiness
          path: |
            dist/Libre-Remote-Public-Source.zip
            dist/Libre-Remote-Public-Source.zip.sha256
            dist/Libre-Remote/public-release-audit.json
            private-history-audit.json
            runtime-security-audit.json
            gradle-dependencies.txt
            THIRD_PARTY_NOTICES.generated.md
          retention-days: 14
