name: Finalize and Build Libre Remote 2

on:
  push:
    branches: [feature/libre-remote-2-product-foundation]
    paths:
      - ".github/workflows/finalize-libre-remote-product.yml"
      - ".final-b64/**"
      - ".final-materialize/**"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: libre-remote-2-final-product
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/libre-remote-2-product-foundation
          fetch-depth: 0

      - name: Recover reviewed product source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f lg-wifi-remote-app/app/src/main/java/com/geronimo/controlelgwifi/ProductDatabase.kt ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            rm -rf lg-wifi-remote-app/app/schemas
            mkdir -p lg-wifi-remote-app/app/schemas
            exit 0
          fi
          artifacts=$(curl --fail-with-body -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/artifacts?name=libre-final-payload-diagnostics&per_page=100")
          artifact_id=$(jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty' <<<"$artifacts")
          [ -n "$artifact_id" ] || artifact_id=8269145198
          curl --fail-with-body -sSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" \
            -o /tmp/source.zip
          rm -rf /tmp/source && mkdir -p /tmp/source
          unzip -q /tmp/source.zip -d /tmp/source
          archive=$(find /tmp/source -type f -name reconstructed.tar.gz -print -quit)
          test -n "$archive"
          python3 - "$archive" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          data = bytearray(path.read_bytes())
          for offset, old, new in ((63805, 0o367, 0o365), (63806, 0o66, 0o166)):
              if data[offset] != old:
                  raise SystemExit(f"Unexpected source byte at {offset}: {data[offset]:#o}")
              data[offset] = new
          path.write_bytes(data)
          PY
          echo "5f537a05fd3f6615edda498563210d51e7549ad81849a7fd48039f63c3facfe4  $archive" | sha256sum -c -
          tar -tzf "$archive" > /tmp/source-files.txt
          tar -xzf "$archive" -C lg-wifi-remote-app
          rm -rf lg-wifi-remote-app/app/schemas
          mkdir -p lg-wifi-remote-app/app/schemas
          rm -rf .final-b64 .final-materialize .final-overlay* .final-source* .final-suffix*
          rm -f lg-wifi-remote-app/.*trigger* lg-wifi-remote-app/.universal-*
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Generate Gradle wrapper
        working-directory: lg-wifi-remote-app
        run: |
          gradle wrapper --gradle-version 8.10.2 --distribution-type bin
          chmod +x gradlew

      - name: Configure temporary release signing
        shell: bash
        run: |
          set -euo pipefail
          password=$(openssl rand -hex 18)
          alias=libre-remote-final-test
          echo "::add-mask::$password"
          keytool -genkeypair -keystore "$RUNNER_TEMP/test.jks" -storepass "$password" -keypass "$password" -alias "$alias" -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=Libre Remote Final Test, OU=Open Source, O=Libre Remote Community, L=Rio de Janeiro, ST=RJ, C=BR"
          echo "LIBRE_KEYSTORE_PATH=$RUNNER_TEMP/test.jks" >> "$GITHUB_ENV"
          echo "LIBRE_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "LIBRE_KEY_ALIAS=$alias" >> "$GITHUB_ENV"
          echo "LIBRE_KEY_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Unit tests, release lint, APK and AAB
        id: build
        continue-on-error: true
        working-directory: lg-wifi-remote-app
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease 2>&1 | tee build-final.log

      - name: Package successful candidate
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm -f lg-wifi-remote-app/CI_FAILURE.txt
          mkdir -p output/source output/store
          APK=lg-wifi-remote-app/app/build/outputs/apk/release/app-release.apk
          AAB=lg-wifi-remote-app/app/build/outputs/bundle/release/app-release.aab
          cp "$APK" output/Libre-Remote-2.0.0-rc1-test.apk
          cp "$AAB" output/Libre-Remote-2.0.0-rc1-test.aab
          signer=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$signer" verify --verbose --print-certs "$APK" > output/APK-SIGNATURE.txt
          sha256sum output/*.apk output/*.aab > output/SHA256SUMS.txt
          rsync -a --exclude build --exclude .gradle --exclude .kotlin --exclude local.properties lg-wifi-remote-app/ output/source/
          (cd output && zip -qr Libre-Remote-2.0.0-rc1-source.zip source && rm -rf source)
          cp -r lg-wifi-remote-app/store-listing/. output/store/
          printf 'Final reviewed graphics are delivered separately.\n' > output/store/GRAPHICS-NOTE.txt
          (cd output && zip -qr Libre-Remote-2.0.0-play-store-materials.zip store && rm -rf store)
          cp lg-wifi-remote-app/build-final.log output/BUILD-LOG.txt
          cp lg-wifi-remote-app/app/build/reports/lint-results-release.html output/LINT-REPORT.html
          printf 'Temporary CI test signature; use the permanent Play upload key for production.\n' > output/IMPORTANT-SIGNING.txt
          {
            echo '# Libre Remote 2 CI success'
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_ID"
            echo 'Validated: unit tests, release lint, release APK, release AAB and APK signature.'
            echo
            cat output/SHA256SUMS.txt
          } > lg-wifi-remote-app/CI_SUCCESS.md

      - name: Record build failure
        if: steps.build.outcome != 'success'
        shell: bash
        run: |
          rm -f lg-wifi-remote-app/CI_SUCCESS.md
          {
            echo '# Libre Remote 2 CI failure'
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_ID"
            echo
            echo '```text'
            grep -nE '(^e:| error: |FAILURE|What went wrong|Unresolved reference|Compilation error|Exception)' lg-wifi-remote-app/build-final.log | tail -n 160 || true
            echo
            tail -n 260 lg-wifi-remote-app/build-final.log || true
            echo '```'
          } > lg-wifi-remote-app/CI_FAILURE.txt

      - name: Commit CI result
        if: always()
        shell: bash
        run: |
          git config user.name "Libre Remote CI"
          git config user.email "actions@users.noreply.github.com"
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            git add -A
            message='Materialize validated Libre Remote 2.0 RC1 product [ci-result]'
          else
            git add lg-wifi-remote-app/CI_FAILURE.txt
            message='Record Libre Remote 2 final build failure [ci-result]'
          fi
          if ! git diff --cached --quiet; then
            git commit -m "$message"
            git push origin HEAD:feature/libre-remote-2-product-foundation
          fi

      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: Libre-Remote-2.0.0-RC1-final-candidate
          path: output/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Libre-Remote-2.0.0-final-validation-reports
          path: |
            /tmp/source-files.txt
            lg-wifi-remote-app/build-final.log
            lg-wifi-remote-app/app/build/reports/**
          if-no-files-found: warn
          retention-days: 14

      - name: Fail after preserving diagnostics
        if: steps.build.outcome != 'success'
        run: exit 1
