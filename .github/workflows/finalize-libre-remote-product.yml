name: Finalize Libre Remote Product Branch

on:
  push:
    branches:
      - feature/libre-remote-2-product-foundation
    paths:
      - ".github/workflows/finalize-libre-remote-product.yml"
      - ".final-materialize/finalize-v2.sh"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout preparation commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Preserve finalizer outside repository
        run: cp .final-materialize/finalize-v2.sh /tmp/finalize-libre-remote.sh

      - name: Materialize reviewed final source tree
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: feature/libre-remote-2-product-foundation
          PARENT_SHA: ${{ github.sha }}
          FINAL_TREE_SHA: ee675bcc8ad8d29fec545bf07759628ceced26f8
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/git/commits" \
            -d "$(jq -n --arg message 'Materialize Libre Remote 2 final source [materialized-final-v2]' --arg tree "$FINAL_TREE_SHA" --arg parent "$PARENT_SHA" '{message:$message,tree:$tree,parents:[$parent]}')")
          commit_sha=$(jq -r '.sha' <<<"$response")
          test -n "$commit_sha"; test "$commit_sha" != null
          curl --fail-with-body -sS -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/git/refs/heads/$BRANCH" \
            -d "$(jq -n --arg sha "$commit_sha" '{sha:$sha,force:false}')"

      - name: Refresh checkout to materialized commit
        run: |
          git fetch origin feature/libre-remote-2-product-foundation
          git reset --hard origin/feature/libre-remote-2-product-foundation

      - name: Apply final product cleanup and documentation
        run: bash /tmp/finalize-libre-remote.sh "$GITHUB_WORKSPACE"
