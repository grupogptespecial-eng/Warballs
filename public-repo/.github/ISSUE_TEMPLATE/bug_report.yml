name: Bug report
description: Report a reproducible Libre Remote defect
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include pairing keys, tokens, private certificates, signing material, or exploit details. Security issues belong in private vulnerability reporting.
  - type: input
    id: version
    attributes:
      label: Libre Remote version/commit
      placeholder: e.g. 1.0.0 / commit SHA
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host platform
      options: [Android, iPhone/iPad, Windows, Linux, macOS, Other]
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: TV/device model and firmware
      description: Leave blank if not relevant.
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: Numbered steps that reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs/screenshots
      description: Remove private IPs/identifiers and all secrets before attaching.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets/private data and this is not a vulnerability report.
          required: true
