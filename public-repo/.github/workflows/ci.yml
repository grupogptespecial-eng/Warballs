name: Libre Remote Public CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LIBRE_REMOTE_TEST_SECURE_STORE: '1'

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Compile repository auditors
        run: python3 -m py_compile scripts/*.py
      - name: Public tree audit
        run: python3 scripts/audit_public_release.py --root . --allow-pending-third-party --report public-release-audit.json
      - name: Clean history audit
        run: python3 scripts/audit_git_history.py --repo . --strict --report git-history-audit.json
      - name: Spec integrity
        if: hashFiles('scripts/validate_libre_remote_specs.py') != ''
        run: python3 scripts/validate_libre_remote_specs.py
      - name: Protocol fixture self-test
        run: python3 protocol-lab/libre_remote_lab.py --self-test --json | tee protocol-lab.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-source-audit
          path: |
            public-release-audit.json
            git-history-audit.json
            protocol-lab.json

  desktop:
    needs: source-audit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic
      - name: Desktop tests
        working-directory: libre-remote-universal
        shell: bash
        run: gradle --no-daemon --stacktrace :composeApp:desktopTest
      - name: Packaged app image
        working-directory: libre-remote-universal
        shell: bash
        run: gradle --no-daemon --stacktrace :composeApp:createDistributable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-desktop-${{ runner.os }}
          path: |
            libre-remote-universal/composeApp/build/reports/**
            libre-remote-universal/composeApp/build/test-results/**

  android:
    needs: source-audit
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic
      - name: Android debug build
        working-directory: libre-remote-universal
        run: gradle --no-daemon --stacktrace :composeApp:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-android-debug
          path: libre-remote-universal/composeApp/build/outputs/apk/debug/*.apk

  apple:
    needs: source-audit
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic
      - name: Compile iOS simulator and device frameworks
        working-directory: libre-remote-universal
        run: |
          gradle --no-daemon --stacktrace \
            :composeApp:linkDebugFrameworkIosSimulatorArm64 \
            :composeApp:linkDebugFrameworkIosArm64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-apple-frameworks
          path: |
            libre-remote-universal/composeApp/build/bin/iosSimulatorArm64/debugFramework/**
            libre-remote-universal/composeApp/build/bin/iosArm64/debugFramework/**

  dependency-inventory:
    needs: source-audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic
      - name: Resolve Gradle dependency graph
        working-directory: libre-remote-universal
        run: gradle --no-daemon :composeApp:dependencies > ../gradle-dependencies.txt
      - name: Generate reviewable license inventory
        run: |
          python3 scripts/audit_third_party_licenses.py \
            --dependencies gradle-dependencies.txt \
            --root libre-remote-universal \
            --output THIRD_PARTY_NOTICES.generated.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: third-party-license-inventory
          path: |
            gradle-dependencies.txt
            THIRD_PARTY_NOTICES.generated.md
